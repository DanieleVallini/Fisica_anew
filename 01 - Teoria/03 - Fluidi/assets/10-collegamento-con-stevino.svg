<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400" role="img" aria-label="Pascal e Stevino lavorano insieme">
<rect width="840" height="400" rx="18" fill="white"/>
<rect x="1" y="1" width="838" height="398" rx="17" fill="none" stroke="#dae8ee" stroke-width="2"/>
<text x="30" y="44" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#193448">Pascal e Stevino lavorano insieme</text>
<text x="30" y="72" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#516779">Una pressione aggiunta non annulla la differenza dovuta alla profondità</text>
<text x="220" y="117" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#193448" text-anchor="middle">Prima dell’aumento</text><rect x="97" y="141" width="246" height="177" rx="5" fill="#daf1fa" stroke="#2782af" stroke-width="2"/><line x1="97" y1="141" x2="343" y2="141" stroke="#2782af" stroke-width="3" stroke-linecap="round"/><circle cx="155" cy="201" r="7" fill="#2782af"/><circle cx="155" cy="273" r="7" fill="#2782af"/><text x="171" y="207" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="600" fill="#193448">p₁</text><text x="171" y="278" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="600" fill="#193448">p₂</text><text x="220" y="351" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#218468" text-anchor="middle">p₂ − p₁ = ρg Δh</text><text x="625" y="117" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#193448" text-anchor="middle">Dopo l’aumento</text><rect x="502" y="141" width="246" height="177" rx="5" fill="#daf1fa" stroke="#2782af" stroke-width="2"/><line x1="502" y1="141" x2="748" y2="141" stroke="#2782af" stroke-width="3" stroke-linecap="round"/><circle cx="560" cy="201" r="7" fill="#2782af"/><circle cx="560" cy="273" r="7" fill="#2782af"/><text x="576" y="207" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="600" fill="#193448">p₁ + Δp</text><text x="576" y="278" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="600" fill="#193448">p₂ + Δp</text><text x="625" y="351" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#218468" text-anchor="middle">p’₂ − p’₁ = ρg Δh</text><line x1="376" y1="226" x2="464" y2="226" stroke="#218468" stroke-width="4" stroke-linecap="round"/><path d="M 464 226 L 454.29 231.18 L 454.29 220.82 Z" fill="#218468"/><text x="420" y="208" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#218468" text-anchor="middle">Pascal: +Δp</text><text x="420" y="383" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#516779" text-anchor="middle">La variazione aggiunta è uguale; il dislivello mantiene la differenza iniziale.</text>
</svg>