<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400" role="img" aria-label="Bernoulli: i contributi energetici">
<rect width="840" height="400" rx="18" fill="white"/>
<rect x="1" y="1" width="838" height="398" rx="17" fill="none" stroke="#dae8ee" stroke-width="2"/>
<text x="30" y="44" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#193448">Bernoulli: i contributi energetici</text>
<text x="30" y="72" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#516779">Nel caso orizzontale ideale, p e ½ρv² si compensano</text>
<text x="195" y="130" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#193448" text-anchor="middle">PUNTO 1</text><text x="633" y="130" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#193448" text-anchor="middle">PUNTO 2</text><rect x="108" y="160" width="183" height="130" rx="1" fill="#bddff2" stroke="#2782af" stroke-width="1"/><rect x="108" y="290" width="183" height="46" rx="1" fill="#d9edda" stroke="#218468" stroke-width="1"/><text x="199" y="231.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600" fill="#193448" text-anchor="middle">p₁ maggiore</text><text x="199" y="319.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#218468" text-anchor="middle">½ρv²</text><rect x="545" y="160" width="183" height="70" rx="1" fill="#bddff2" stroke="#2782af" stroke-width="1"/><rect x="545" y="230" width="183" height="106" rx="1" fill="#d9edda" stroke="#218468" stroke-width="1"/><text x="636" y="201.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600" fill="#193448" text-anchor="middle">p₂ minore</text><text x="636" y="289.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#218468" text-anchor="middle">½ρv²</text><line x1="82" y1="160" x2="755" y2="160" stroke="#516779" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 6"/><line x1="82" y1="336" x2="755" y2="336" stroke="#516779" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 6"/><text x="420" y="211" font-family="DejaVu Sans, Arial, sans-serif" font-size="33" font-weight="700" fill="#dc8b32" text-anchor="middle">=</text><text x="420" y="370" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#193448" text-anchor="middle">p + ½ρv² + ρgz = costante</text><text x="420" y="108" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#516779" text-anchor="middle">A quota uguale: pressione statica e termine cinetico si compensano.</text>
</svg>