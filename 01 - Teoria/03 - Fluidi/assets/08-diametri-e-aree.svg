<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400" role="img" aria-label="Diametri: il rapporto va al quadrato">
<rect width="840" height="400" rx="18" fill="white"/>
<rect x="1" y="1" width="838" height="398" rx="17" fill="none" stroke="#dae8ee" stroke-width="2"/>
<text x="30" y="44" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#193448">Diametri: il rapporto va al quadrato</text>
<text x="30" y="72" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#516779">Se il diametro cresce di 5 volte, l’area cresce di 25 volte</text>
<circle cx="205" cy="226" r="23" fill="#f1f8fb" stroke="#2782af" stroke-width="3"/><circle cx="626" cy="226" r="115" fill="#b7e2f7" stroke="#2782af" stroke-width="3"/><line x1="182" y1="226" x2="228" y2="226" stroke="#dc8b32" stroke-width="3" stroke-linecap="round"/><line x1="511" y1="226" x2="741" y2="226" stroke="#218468" stroke-width="3" stroke-linecap="round"/><text x="205" y="131" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#193448" text-anchor="middle">d₁ = 2 cm</text><text x="625" y="93" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#193448" text-anchor="middle">d₂ = 10 cm</text><text x="205" y="291" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#dc8b32" text-anchor="middle">A₁</text><text x="626" y="360" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#218468" text-anchor="middle">A₂ = 25 A₁</text><text x="345" y="174" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2782af" text-anchor="middle">×5</text><line x1="261" y1="197" x2="482" y2="197" stroke="#2782af" stroke-width="4" stroke-linecap="round"/><path d="M 482 197 L 472.29 202.18 L 472.29 191.82 Z" fill="#2782af"/><text x="358" y="331" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#218468" text-anchor="middle">A₂ / A₁ = (10 / 2)² = 25</text>
</svg>