<svg xmlns="http://www.w3.org/2000/svg" width="840" height="407" viewBox="0 0 840 407" role="img" aria-label="Assoluta o relativa?">
<rect width="840" height="407" fill="#ffffff" rx="18"/>
<rect x="1" y="1" width="838" height="405" rx="17" stroke="#d9e8ee" stroke-width="2" fill="none"/>
<text x="31" y="43" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#183046">Assoluta o relativa?</text>
<text x="31" y="70" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#4a6375">La pressione relativa è l’aumento rispetto all’atmosfera</text>
<g font-family="DejaVu Sans, Arial, sans-serif"><rect x="135" y="190" width="170" height="143" rx="0" fill="#b4cadb"/><text x="220" y="364" font-size="17" fill="#183046" font-weight="bold" text-anchor="middle">Superficie</text><rect x="515" y="190" width="170" height="143" rx="0" fill="#b4cadb"/><rect x="515" y="116" width="170" height="74" rx="0" fill="#70d0bc"/><text x="600" y="364" font-size="17" fill="#183046" font-weight="bold" text-anchor="middle">Profondità h</text><text x="220" y="265" font-size="18" fill="#183046" font-weight="bold" text-anchor="middle">p atmosferica</text><text x="600" y="160" font-size="22" fill="#087e88" font-weight="bold" text-anchor="middle">ρgh</text><text x="600" y="265" font-size="17" fill="#183046" font-weight="bold" text-anchor="middle">p atmosferica</text><text x="420" y="102" font-size="19" fill="#087e88" font-weight="bold" text-anchor="middle">Aumento di pressione = ρgh</text><text x="420" y="392" font-size="19" fill="#183046" font-weight="bold" text-anchor="middle">p assoluta = p atmosferica + ρgh</text></g>
</svg>