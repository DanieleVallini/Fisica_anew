<line x1="38" y1="102" x2="862" y2="102" stroke="#C7D7E4" stroke-width="2" /><rect x="45" y="183" width="365" height="224" rx="0" fill="#DCEFFB" stroke="none" stroke-width="2"/><path d="M45 128 V407 H410 V128" fill="none" stroke="#22364D" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><line x1="45" y1="183" x2="410" y2="183" stroke="#137DB5" stroke-width="3" /><rect x="172" y="228" width="104" height="97" rx="7" fill="#F8C56C" stroke="#EBA73A" stroke-width="3"/><line x1="224" y1="272" x2="224.0" y2="184.0" stroke="#159467" stroke-width="6" /><polygon points="224,172 230.45,187.0 217.55,187.0" fill="#159467"/><line x1="224" y1="283" x2="224.0" y2="364.0" stroke="#D95F58" stroke-width="6" /><polygon points="224,376 217.55,361.0 230.45,361.0" fill="#D95F58"/><text x="284" y="187" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#159467" text-anchor="start">F_A</text><text x="284" y="376" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#D95F58" text-anchor="start">P</text><text x="466" y="169" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#22364D" text-anchor="start">Verso positivo: ↑</text><rect x="465" y="204" width="382" height="72" rx="12" fill="#F0F7FC" stroke="none" stroke-width="0"/><text x="483" y="249" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#137DB5" text-anchor="start">F_A − P = m a</text><text x="474" y="318" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="500" fill="#22364D" text-anchor="start">La forza risultante determina</text><text x="474" y="347" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="500" fill="#22364D" text-anchor="start">il verso dell’accelerazione,</text><text x="474" y="376" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="500" fill="#667A90" text-anchor="start">non necessariamente della velocità.</text>
