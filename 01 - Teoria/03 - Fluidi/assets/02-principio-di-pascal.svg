<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400" role="img" aria-label="Il principio di Pascal">
<rect width="840" height="400" rx="18" fill="white"/>
<rect x="1" y="1" width="838" height="398" rx="17" fill="none" stroke="#dae8ee" stroke-width="2"/>
<text x="30" y="44" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#193448">Il principio di Pascal</text>
<text x="30" y="72" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#516779">L’aumento di pressione si trasmette integralmente nel fluido confinato</text>
<rect x="72" y="141" width="690" height="166" rx="8" fill="#daf1fa" stroke="#2782af" stroke-width="2"/><rect x="72" y="125" width="164" height="17" rx="2" fill="#708b9d"/><rect x="689" y="125" width="73" height="17" rx="2" fill="#708b9d"/><line x1="152" y1="92" x2="152" y2="127" stroke="#dc8b32" stroke-width="5" stroke-linecap="round"/><path d="M 152 127 L 146.82 117.29 L 157.18 117.29 Z" fill="#dc8b32"/><text x="171" y="111" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" fill="#dc8b32">Δp applicato</text><circle cx="315" cy="178" r="23" fill="#e7f6fb" stroke="#2782af" stroke-width="2"/><text x="315" y="184" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#218468" text-anchor="middle">+Δp</text><circle cx="487" cy="178" r="23" fill="#e7f6fb" stroke="#2782af" stroke-width="2"/><text x="487" y="184" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#218468" text-anchor="middle">+Δp</text><circle cx="340" cy="260" r="23" fill="#e7f6fb" stroke="#2782af" stroke-width="2"/><text x="340" y="266" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#218468" text-anchor="middle">+Δp</text><circle cx="585" cy="260" r="23" fill="#e7f6fb" stroke="#2782af" stroke-width="2"/><text x="585" y="266" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#218468" text-anchor="middle">+Δp</text><line x1="405" y1="203" x2="475" y2="203" stroke="#218468" stroke-width="3" stroke-linecap="round"/><path d="M 475 203 L 465.29 208.18 L 465.29 197.82 Z" fill="#218468"/><line x1="405" y1="226" x2="350" y2="226" stroke="#218468" stroke-width="3" stroke-linecap="round"/><path d="M 350 226 L 359.71 220.82 L 359.71 231.18 Z" fill="#218468"/><text x="430" y="338" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#218468" text-anchor="middle">Δp₁ = Δp₂ = Δp₃ = Δp₄</text><text x="420" y="372" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#516779" text-anchor="middle">L’incremento di pressione è trasmesso a tutto il fluido</text>
</svg>