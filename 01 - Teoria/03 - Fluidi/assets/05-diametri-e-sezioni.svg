<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400" role="img" aria-label="Attenzione al quadrato del diametro">
<rect width="840" height="400" rx="18" fill="white"/>
<rect x="1" y="1" width="838" height="398" rx="17" fill="none" stroke="#dae8ee" stroke-width="2"/>
<text x="30" y="44" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#193448">Attenzione al quadrato del diametro</text>
<text x="30" y="72" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#516779">Dimezzando il diametro, l’area diventa un quarto</text>
<circle cx="230" cy="220" r="82" fill="#b7e2f7" stroke="#2782af" stroke-width="3"/><line x1="148" y1="220" x2="312" y2="220" stroke="#dc8b32" stroke-width="3" stroke-linecap="round"/><text x="230" y="119" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#193448" text-anchor="middle">d₁</text><text x="230" y="324" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#218468" text-anchor="middle">A₁</text><circle cx="615" cy="220" r="41" fill="#b7e2f7" stroke="#2782af" stroke-width="3"/><line x1="574" y1="220" x2="656" y2="220" stroke="#dc8b32" stroke-width="3" stroke-linecap="round"/><text x="615" y="119" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#193448" text-anchor="middle">d₂ = d₁ / 2</text><text x="615" y="324" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#218468" text-anchor="middle">A₂ = A₁ / 4</text><line x1="346" y1="216" x2="509" y2="216" stroke="#2782af" stroke-width="4" stroke-linecap="round"/><path d="M 509 216 L 498.36 221.54 L 498.36 210.46 Z" fill="#2782af"/><text x="425" y="189" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#2782af" text-anchor="middle">diametro ÷ 2</text><text x="420" y="371" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#218468" text-anchor="middle">Se Q resta costante:   v₂ = 4 v₁</text>
</svg>