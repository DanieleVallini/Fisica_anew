<svg xmlns="http://www.w3.org/2000/svg" width="840" height="396" viewBox="0 0 840 396" role="img" aria-label="Da dove nasce la legge di Stevino?">
<rect width="840" height="396" fill="#ffffff" rx="18"/>
<rect x="1" y="1" width="838" height="394" rx="17" stroke="#d9e8ee" stroke-width="2" fill="none"/>
<text x="31" y="43" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#183046">Da dove nasce la legge di Stevino?</text>
<text x="31" y="70" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#4a6375">Equilibrio delle forze su una colonna di liquido</text>
<g font-family="DejaVu Sans, Arial, sans-serif"><rect x="240" y="124" width="260" height="170" rx="1" fill="#d7f0fc" stroke="#247ba8" stroke-width="2"/><rect x="240" y="124" width="260" height="170" rx="1" fill="none" stroke="#247ba8" stroke-width="2"/><line x1="369" y1="84" x2="369" y2="119" stroke="#d88433" stroke-width="4"/><path d="M369 119 L363.92 109.24 L374.08 109.24 Z" stroke="#d88433" stroke-width="1" fill="#d88433" stroke-linecap="round" stroke-linejoin="round"/><text x="387" y="102" font-size="19" fill="#d88433" font-weight="bold" text-anchor="start">p₀ A</text><line x1="369" y1="215" x2="369" y2="271" stroke="#d88433" stroke-width="4"/><path d="M369 271 L363.92 261.24 L374.08 261.24 Z" stroke="#d88433" stroke-width="1" fill="#d88433" stroke-linecap="round" stroke-linejoin="round"/><text x="387" y="239" font-size="19" fill="#d88433" font-weight="bold" text-anchor="start">mg</text><line x1="369" y1="337" x2="369" y2="300" stroke="#268467" stroke-width="5"/><path d="M369 300 L374.08 309.76 L363.92 309.76 Z" stroke="#268467" stroke-width="1" fill="#268467" stroke-linecap="round" stroke-linejoin="round"/><text x="390" y="334" font-size="19" fill="#268467" font-weight="bold" text-anchor="start">p A</text><line x1="218" y1="124" x2="218" y2="294" stroke="#183046" stroke-width="2"/><line x1="204" y1="124" x2="231" y2="124" stroke="#183046" stroke-width="2"/><line x1="204" y1="294" x2="231" y2="294" stroke="#183046" stroke-width="2"/><text x="189" y="216" font-size="22" fill="#183046" font-weight="bold" text-anchor="start">h</text><text x="532" y="173" font-size="19" fill="#183046" font-weight="bold" text-anchor="start">Colonna di fluido</text><text x="532" y="206" font-size="18" fill="#4a6375" font-weight="normal" text-anchor="start">Volume = A · h</text><text x="532" y="237" font-size="18" fill="#4a6375" font-weight="normal" text-anchor="start">Massa = ρ · A · h</text><text x="532" y="280" font-size="18" fill="#087e88" font-weight="bold" text-anchor="start">Equilibrio:</text><text x="532" y="308" font-size="18" fill="#183046" font-weight="normal" text-anchor="start">pA = p₀A + mg</text><text x="58" y="355" font-size="16" fill="#4a6375" font-weight="normal" text-anchor="start">La superficie A si semplifica: la forma del recipiente non compare.</text></g>
</svg>