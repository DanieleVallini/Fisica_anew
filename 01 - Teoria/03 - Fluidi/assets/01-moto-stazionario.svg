<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400" role="img" aria-label="Moto stazionario ≠ velocità uniforme">
<rect width="840" height="400" rx="18" fill="white"/>
<rect x="1" y="1" width="838" height="398" rx="17" fill="none" stroke="#dae8ee" stroke-width="2"/>
