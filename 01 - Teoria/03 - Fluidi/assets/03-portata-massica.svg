<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400" role="img" aria-label="Portata volumetrica e portata massica">
<rect width="840" height="400" rx="18" fill="white"/>
<rect x="1" y="1" width="838" height="398" rx="17" fill="none" stroke="#dae8ee" stroke-width="2"/>
<text x="30" y="44" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#193448">Portata volumetrica e portata massica</text>
<text x="30" y="72" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#516779">La densità permette di passare dal volume alla massa per secondo</text>
<rect x="44" y="139" width="268" height="160" rx="9" fill="#f1f8fb" stroke="#dae8ee" stroke-width="2"/><text x="178" y="173" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#516779" text-anchor="middle">VOLUME</text><text x="178" y="226" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#2782af" text-anchor="middle">Q = A · v</text><text x="178" y="267" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="600" fill="#193448" text-anchor="middle">m³/s</text><rect x="526" y="139" width="268" height="160" rx="9" fill="#f1f8fb" stroke="#dae8ee" stroke-width="2"/><text x="660" y="173" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#516779" text-anchor="middle">MASSA</text><text x="660" y="226" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#218468" text-anchor="middle">ṁ = ρ · Q</text><text x="660" y="267" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="600" fill="#193448" text-anchor="middle">kg/s</text><line x1="332" y1="225" x2="506" y2="225" stroke="#dc8b32" stroke-width="4" stroke-linecap="round"/><path d="M 506 225 L 495.36 230.54 L 495.36 219.46 Z" fill="#dc8b32"/><text x="420" y="204" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#dc8b32" text-anchor="middle">× densità ρ</text><text x="420" y="346" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="500" fill="#193448" text-anchor="middle">Stesso flusso: volume/tempo ↔ massa/tempo</text>
</svg>