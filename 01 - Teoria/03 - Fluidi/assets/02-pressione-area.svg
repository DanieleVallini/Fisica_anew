<text x="31" y="43" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#183046">Pressione e superficie</text>
<text x="31" y="70" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#4a6375">A parità di forza, la pressione cresce quando l’area diminuisce</text>
