<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400" role="img" aria-label="Stessa pressione, forze diverse">
<rect width="840" height="400" rx="18" fill="white"/>
<rect x="1" y="1" width="838" height="398" rx="17" fill="none" stroke="#dae8ee" stroke-width="2"/>
<text x="30" y="44" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#193448">Stessa pressione, forze diverse</text>
<text x="30" y="72" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#516779">La forza dipende dall’area su cui agisce la pressione</text>
<text x="215" y="110" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#193448" text-anchor="middle">A₁ piccola</text><rect x="165.0" y="206" width="100" height="58" rx="6" fill="#f1f8fb" stroke="#2782af" stroke-width="2"/><line x1="215" y1="129" x2="215" y2="199" stroke="#dc8b32" stroke-width="5" stroke-linecap="round"/><path d="M 215 199 L 209.82 189.29 L 220.18 189.29 Z" fill="#dc8b32"/><text x="234" y="158" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#dc8b32">F₁</text><text x="215" y="250" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#516779" text-anchor="middle">Stessa pressione p</text><text x="630" y="110" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#193448" text-anchor="middle">A₂ grande</text><rect x="505.0" y="206" width="250" height="58" rx="6" fill="#f1f8fb" stroke="#2782af" stroke-width="2"/><line x1="630" y1="129" x2="630" y2="199" stroke="#dc8b32" stroke-width="5" stroke-linecap="round"/><path d="M 630 199 L 624.82 189.29 L 635.18 189.29 Z" fill="#dc8b32"/><text x="649" y="158" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#dc8b32">F₂</text><text x="630" y="250" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#516779" text-anchor="middle">Stessa pressione p</text><line x1="55" y1="284" x2="785" y2="284" stroke="#516779" stroke-width="2" stroke-linecap="round"/><text x="215" y="325" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#218468" text-anchor="middle">F₁ = p · A₁</text><text x="630" y="325" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#218468" text-anchor="middle">F₂ = p · A₂</text><text x="420" y="374" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600" fill="#193448" text-anchor="middle">Area più grande  →  forza maggiore, a pressione uguale</text>
