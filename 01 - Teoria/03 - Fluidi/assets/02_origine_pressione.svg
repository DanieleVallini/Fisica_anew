<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460">
<rect width="900" height="460" rx="22" fill="#FCFEFF"/>
<text x="38" y="49" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#22364D" text-anchor="start">Da Stevino ad Archimede</text><text x="38" y="83" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#667A90" text-anchor="start">La differenza di pressione genera una forza risultante verso l’alto</text>
<line x1="38" y1="102" x2="862" y2="102" stroke="#C7D7E4" stroke-width="2" /><rect x="50" y="158" width="410" height="260" rx="0" fill="#DCEFFB" stroke="none" stroke-width="2"/><path d="M50 124 V418 H460 V124" fill="none" stroke="#22364D" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><line x1="50" y1="158" x2="460" y2="158" stroke="#137DB5" stroke-width="3" /><rect x="165" y="206" width="155" height="139" rx="7" fill="#FED9A0" stroke="#EBA73A" stroke-width="3"/><line x1="244" y1="185" x2="244.0" y2="229.0" stroke="#D95F58" stroke-width="6" /><polygon points="244,241 237.55,226.0 250.45,226.0" fill="#D95F58"/><line x1="244" y1="376" x2="244.0" y2="312.0" stroke="#159467" stroke-width="8" /><polygon points="244,300 250.45,315.0 237.55,315.0" fill="#159467"/><text x="338" y="224" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" fill="#D95F58" text-anchor="start">p₁ (minore)</text><text x="338" y="350" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#159467" text-anchor="start">p₂ (maggiore)</text><line x1="72" y1="205" x2="155" y2="205" stroke="#C7D7E4" stroke-width="2" stroke-dasharray="8,6" /><line x1="72" y1="345" x2="155" y2="345" stroke="#C7D7E4" stroke-width="2" stroke-dasharray="8,6" /><text x="82" y="197" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="500" fill="#667A90" text-anchor="start">h₁</text><text x="82" y="337" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="500" fill="#667A90" text-anchor="start">h₂</text><text x="518" y="173" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#22364D" text-anchor="start">La pressione aumenta</text><text x="518" y="203" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="500" fill="#22364D" text-anchor="start">con la profondità.</text><text x="518" y="267" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#159467" text-anchor="start">La forza dal basso</text><text x="518" y="297" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="500" fill="#667A90" text-anchor="start">supera quella dall’alto.</text><text x="518" y="371" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" fill="#22364D" text-anchor="start">Risultante: verso l’alto</text>
</svg>