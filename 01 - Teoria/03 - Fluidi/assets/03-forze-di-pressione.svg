<svg xmlns="http://www.w3.org/2000/svg" width="840" height="389" viewBox="0 0 840 389" role="img" aria-label="Pressione in un fluido in equilibrio">
<rect width="840" height="389" fill="#ffffff" rx="18"/>
<rect x="1" y="1" width="838" height="387" rx="17" stroke="#d9e8ee" stroke-width="2" fill="none"/>
<text x="31" y="43" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#183046">Pressione in un fluido in equilibrio</text>
<text x="31" y="70" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#4a6375">Le forze del fluido sono normali alle superfici</text>
<g font-family="DejaVu Sans, Arial, sans-serif"><rect x="60" y="104" width="720" height="226" rx="5" fill="#d9f0fb"/><path d="M60 106 Q115 95 170 106 T280 106 T390 106 T500 106 T610 106 T720 106 T780 106" stroke="#247ba8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="334" y="171" width="172" height="112" rx="1" fill="#f9fdfd" stroke="#183046" stroke-width="3"/><line x1="420" y1="129" x2="420" y2="164" stroke="#247ba8" stroke-width="4"/><path d="M420 164 L414.92 154.24 L425.08 154.24 Z" stroke="#247ba8" stroke-width="1" fill="#247ba8" stroke-linecap="round" stroke-linejoin="round"/><text x="439" y="145" font-size="16" fill="#183046" font-weight="normal" text-anchor="start">p sopra</text><line x1="420" y1="316" x2="420" y2="290" stroke="#247ba8" stroke-width="6"/><path d="M420 290 L425.08 299.76 L414.92 299.76 Z" stroke="#247ba8" stroke-width="1" fill="#247ba8" stroke-linecap="round" stroke-linejoin="round"/><text x="446" y="323" font-size="15" fill="#087e88" font-weight="bold" text-anchor="start">p sotto maggiore</text><line x1="278" y1="220" x2="326" y2="220" stroke="#247ba8" stroke-width="4"/><path d="M326 220 L316.24 225.08 L316.24 214.92 Z" stroke="#247ba8" stroke-width="1" fill="#247ba8" stroke-linecap="round" stroke-linejoin="round"/><line x1="562" y1="220" x2="514" y2="220" stroke="#247ba8" stroke-width="4"/><path d="M514 220 L523.76 214.92 L523.76 225.08 Z" stroke="#247ba8" stroke-width="1" fill="#247ba8" stroke-linecap="round" stroke-linejoin="round"/><text x="89" y="157" font-size="18" fill="#183046" font-weight="bold" text-anchor="start">Le forze di pressione</text><text x="89" y="181" font-size="17" fill="#183046" font-weight="normal" text-anchor="start">sono perpendicolari</text><text x="89" y="205" font-size="17" fill="#183046" font-weight="normal" text-anchor="start">a ogni superficie.</text><text x="89" y="351" font-size="16" fill="#4a6375" font-weight="normal" text-anchor="start">A maggiore profondità, nello stesso liquido, la pressione aumenta.</text></g>
</svg>