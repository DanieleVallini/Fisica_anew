<svg xmlns="http://www.w3.org/2000/svg" width="840" height="395" viewBox="0 0 840 395" role="img" aria-label="Perché un fluido scorre?">
<rect width="840" height="395" fill="#ffffff" rx="18"/>
<rect x="1" y="1" width="838" height="393" rx="17" stroke="#d9e8ee" stroke-width="2" fill="none"/>
<text x="31" y="43" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#183046">Perché un fluido scorre?</text>
<text x="31" y="70" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#4a6375">Esempio di sforzo di taglio fra due piastre</text>
<g font-family="DejaVu Sans, Arial, sans-serif"><rect x="76" y="130" width="520" height="155" rx="3" fill="#e5f5fd"/><rect x="67" y="117" width="538" height="16" rx="3" fill="#778b9b"/><rect x="67" y="285" width="538" height="16" rx="3" fill="#778b9b"/><line x1="370" y1="99" x2="550" y2="99" stroke="#268467" stroke-width="5"/><path d="M550 99 L540.24 104.08 L540.24 93.92 Z" stroke="#268467" stroke-width="1" fill="#268467" stroke-linecap="round" stroke-linejoin="round"/><text x="95" y="104" font-size="18" fill="#183046" font-weight="bold" text-anchor="start">Piastra superiore mobile</text><text x="95" y="331" font-size="18" fill="#183046" font-weight="bold" text-anchor="start">Piastra inferiore ferma</text><line x1="105" y1="147" x2="510" y2="147" stroke="#247ba8" stroke-width="3"/><path d="M510 147 L500.24 152.08 L500.24 141.92 Z" stroke="#247ba8" stroke-width="1" fill="#247ba8" stroke-linecap="round" stroke-linejoin="round"/><line x1="105" y1="172" x2="440" y2="172" stroke="#247ba8" stroke-width="3"/><path d="M440 172 L430.24 177.08 L430.24 166.92 Z" stroke="#247ba8" stroke-width="1" fill="#247ba8" stroke-linecap="round" stroke-linejoin="round"/><line x1="105" y1="198" x2="370" y2="198" stroke="#247ba8" stroke-width="3"/><path d="M370 198 L360.24 203.08 L360.24 192.92 Z" stroke="#247ba8" stroke-width="1" fill="#247ba8" stroke-linecap="round" stroke-linejoin="round"/><line x1="105" y1="224" x2="300" y2="224" stroke="#247ba8" stroke-width="3"/><path d="M300 224 L290.24 229.08 L290.24 218.92 Z" stroke="#247ba8" stroke-width="1" fill="#247ba8" stroke-linecap="round" stroke-linejoin="round"/><line x1="105" y1="250" x2="230" y2="250" stroke="#247ba8" stroke-width="3"/><path d="M230 250 L220.24 255.08 L220.24 244.92 Z" stroke="#247ba8" stroke-width="1" fill="#247ba8" stroke-linecap="round" stroke-linejoin="round"/><line x1="105" y1="273" x2="170" y2="273" stroke="#247ba8" stroke-width="3"/><path d="M170 273 L160.24 278.08 L160.24 267.92 Z" stroke="#247ba8" stroke-width="1" fill="#247ba8" stroke-linecap="round" stroke-linejoin="round"/><text x="635" y="176" font-size="17" fill="#183046" font-weight="normal" text-anchor="start">Strati di fluido</text><text x="635" y="202" font-size="17" fill="#183046" font-weight="normal" text-anchor="start">con velocità</text><text x="635" y="228" font-size="17" fill="#183046" font-weight="normal" text-anchor="start">differenti</text><text x="635" y="260" font-size="15" fill="#268467" font-weight="bold" text-anchor="start">Sforzo tangenziale</text><text x="95" y="360" font-size="16" fill="#4a6375" font-weight="normal" text-anchor="start">La forza tangenziale trascina gli strati: il fluido scorre.</text></g>
