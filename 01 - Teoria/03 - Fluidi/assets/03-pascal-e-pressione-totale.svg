<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400" role="img" aria-label="Incremento ≠ pressione totale">
<rect width="840" height="400" rx="18" fill="white"/>
<rect x="1" y="1" width="838" height="398" rx="17" fill="none" stroke="#dae8ee" stroke-width="2"/>
<text x="30" y="44" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#193448">Incremento ≠ pressione totale</text>
<text x="30" y="72" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#516779">Punti a profondità diverse mantengono la differenza idrostatica</text>
<text x="225" y="111" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#2782af" text-anchor="middle">PRIMA</text><rect x="92" y="135" width="266" height="173" rx="5" fill="#daf1fa" stroke="#2782af" stroke-width="2"/><line x1="92" y1="135" x2="358" y2="135" stroke="#2782af" stroke-width="2" stroke-linecap="round"/><circle cx="170" cy="193" r="7" fill="#2782af"/><circle cx="170" cy="276" r="7" fill="#2782af"/><text x="195" y="198" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600" fill="#193448">p₁</text><text x="195" y="281" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600" fill="#193448">p₂</text><text x="225" y="333" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#2782af" text-anchor="middle">p₂ &gt; p₁</text><text x="615" y="111" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#218468" text-anchor="middle">DOPO</text><rect x="482" y="135" width="266" height="173" rx="5" fill="#daf1fa" stroke="#2782af" stroke-width="2"/><line x1="482" y1="135" x2="748" y2="135" stroke="#2782af" stroke-width="2" stroke-linecap="round"/><circle cx="560" cy="193" r="7" fill="#2782af"/><circle cx="560" cy="276" r="7" fill="#2782af"/><text x="585" y="198" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600" fill="#193448">p₁ + Δp</text><text x="585" y="281" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600" fill="#193448">p₂ + Δp</text><text x="615" y="333" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" fill="#218468" text-anchor="middle">Differenza invariata</text><line x1="380" y1="218" x2="455" y2="218" stroke="#218468" stroke-width="4" stroke-linecap="round"/><path d="M 455 218 L 445.29 223.18 L 445.29 212.82 Z" fill="#218468"/><text x="420" y="202" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#218468" 