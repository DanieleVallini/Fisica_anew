<svg xmlns="http://www.w3.org/2000/svg" width="840" height="412" viewBox="0 0 840 412" role="img" aria-label="Due liquidi sovrapposti">
<rect width="840" height="412" fill="#ffffff" rx="18"/>
<rect x="1" y="1" width="838" height="410" rx="17" stroke="#d9e8ee" stroke-width="2" fill="none"/>
<text x="31" y="43" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#183046">Due liquidi sovrapposti</text>
<text x="31" y="70" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#4a6375">Somma dei contributi di pressione dei singoli strati</text>
<g font-family="DejaVu Sans, Arial, sans-serif"><rect x="140" y="108" width="354" height="118" rx="0" fill="#fde5b5"/><rect x="140" y="226" width="354" height="120" rx="0" fill="#a8def7"/><path d="M140 108 L140 346 L494 346 L494 108" stroke="#247ba8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M140 108 L494 108" stroke="#247ba8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M140 226 L494 226" stroke="#247ba8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="317" y="164" font-size="21" fill="#183046" font-weight="bold" text-anchor="middle">Olio · ρ₁</text><text x="317" y="286" font-size="21" fill="#183046" font-weight="bold" text-anchor="middle">Acqua · ρ₂</text><text x="160" y="97" font-size="20" fill="#183046" font-weight="bold" text-anchor="start">p₀</text><line x1="521" y1="108" x2="521" y2="220" stroke="#d88433" stroke-width="2.6"/><path d="M521 220 L515.92 210.24 L526.08 210.24 Z" stroke="#d88433" stroke-width="1" fill="#d88433" stroke-linecap="round" stroke-linejoin="round"/><text x="535" y="172" font-size="19" fill="#d88433" font-weight="bold" text-anchor="start">h₁</text><line x1="521" y1="226" x2="521" y2="346" stroke="#247ba8" stroke-width="2.6"/><path d="M521 346 L515.92 336.24 L526.08 336.24 Z" stroke="#247ba8" stroke-width="1" fill="#247ba8" stroke-linecap="round" stroke-linejoin="round"/><text x="535" y="290" font-size="19" fill="#247ba8" font-weight="bold" text-anchor="start">h₂</text><text x="612" y="163" font-size="19" fill="#183046" font-weight="bold" text-anchor="start">Sul fondo:</text><text x="612" y="212" font-size="21" fill="#183046" font-weight="normal" text-anchor="start">p = p₀ +</text><text x="612" y="247" font-size="22" fill="#d88433" font-weight="bold" text-anchor="start">ρ₁gh₁ +</text><text x="612" y="282" font-size="22" fill="#247ba8" font-weight="bold" text-anchor="start">ρ₂gh₂</text><text x="420" y="379" font-size="17" fill="#4a6375" font-weight="normal" text-anchor="middle">Le pressioni idrostatiche dei due strati si sommano.</text></g>
