<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460">
<rect width="900" height="460" rx="22" fill="#FCFEFF"/>
<text x="38" y="49" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#22364D" text-anchor="start">Volume di liquido spostato</text><text x="38" y="83" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#667A90" text-anchor="start">Completamente immerso e galleggiante: due situazioni diverse</text>
<line x1="38" y1="102" x2="862" y2="102" stroke="#C7D7E4" stroke-width="2" /><rect x="48" y="165" width="370" height="247" rx="0" fill="#DCEFFB" stroke="none" stroke-width="2"/><path d="M48 125 V412 H418 V125" fill="none" stroke="#22364D" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><line x1="48" y1="165" x2="418" y2="165" stroke="#137DB5" stroke-width="3" /><rect x="107" y="184" width="100" height="149" rx="5" fill="#F8C56C" stroke="#EBA73A" stroke-width="3"/><rect x="270" y="130" width="100" height="149" rx="5" fill="#F8C56C" stroke="#EBA73A" stroke-width="3"/><path d="M270 165 H370 V307 H270 Z" fill="none" stroke="#A76E13" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="108" y="358" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#22364D" text-anchor="start">Tutto immerso</text><text x="278" y="358" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#22364D" text-anchor="start">Parzialmente</text><text x="270" y="381" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#22364D" text-anchor="start">immerso</text><text x="498" y="181" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#22364D" text-anchor="start">Formula generale:</text><text x="498" y="235" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" fill="#137DB5" text-anchor="start">F_A = ρ_f g V_imm</text><text x="498" y="304" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="500" fill="#22364D" text-anchor="start">Conta sempre il volume</text><text x="498" y="336" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="500" fill="#22364D" text-anchor="start">di liquido spostato,</text><text x="498" y="368" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="500" fill="#22364D" text-anchor="start">non quello emerso.</text>
</svg>