u Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#667A90" text-anchor="start">Liquido omogeneo e</text><text x="487" y="415" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="500" fill="#667A90" text-anchor="start">incomprimibile</text>
