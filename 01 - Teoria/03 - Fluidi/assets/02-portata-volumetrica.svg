<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400" role="img" aria-label="Portata volumetrica">
<rect width="840" height="400" rx="18" fill="white"/>
<rect x="1" y="1" width="838" height="398" rx="17" fill="none" stroke="#dae8ee" stroke-width="2"/>
<text x="30" y="44" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#193448">Portata volumetrica</text>
<text x="30" y="72" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#516779">Il volume che passa attraverso una sezione dipende da area e velocità</text>
<rect x="90" y="146" width="458" height="130" rx="3" fill="#daf1fa" stroke="#2782af" stroke-width="2"/><rect x="90" y="146" width="75" height="130" rx="2" fill="#b7e2f7" stroke="#2782af" stroke-width="2"/><rect x="165" y="146" width="190" height="130" rx="2" fill="#98d4ec" stroke="#2782af" stroke-width="2"/><rect x="355" y="146" width="193" height="130" rx="2" fill="#daf1fa" stroke="#2782af" stroke-width="2"/><line x1="165" y1="145" x2="165" y2="278" stroke="#dc8b32" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 6"/><line x1="355" y1="145" x2="355" y2="278" stroke="#dc8b32" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 6"/><line x1="173" y1="207" x2="343" y2="207" stroke="#2782af" stroke-width="4" stroke-linecap="round"/><path d="M 343 207 L 332.36 212.54 L 332.36 201.46 Z" fill="#2782af"/><text x="260" y="194" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" fill="#193448" text-anchor="middle">ΔV = A · Δx</text><text x="260" y="237" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" fill="#218468" text-anchor="middle">Δx = v · Δt</text><line x1="565" y1="208" x2="693" y2="208" stroke="#dc8b32" stroke-width="5" stroke-linecap="round"/><path d="M 693 208 L 682.36 213.54 L 682.36 202.46 Z" fill="#dc8b32"/><text x="633" y="186" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#dc8b32" text-anchor="middle">v</text><text x="123" y="134" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#2782af" text-anchor="middle">A</text><text x="421" y="326" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#218468" text-anchor="middle">Q = ΔV / Δt = A · v</text><text x="421" y="362" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#516779" text-anchor="middle">Portata = volume che attraversa la sezione ogni secondo.</text>
</svg>