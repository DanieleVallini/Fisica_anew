<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400" role="img" aria-label="L’energia non si moltiplica">
<rect width="840" height="400" rx="18" fill="white"/>
<rect x="1" y="1" width="838" height="398" rx="17" fill="none" stroke="#dae8ee" stroke-width="2"/>
<text x="30" y="44" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#193448">L’energia non si moltiplica</text>
<text x="30" y="72" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#516779">Lavoro ideale in ingresso = lavoro ideale in uscita</text>
<text x="225" y="116" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" fill="#193448" text-anchor="middle">Lavoro in ingresso</text><text x="625" y="116" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" fill="#193448" text-anchor="middle">Lavoro in uscita</text><rect x="80" y="165" width="290" height="91" rx="8" fill="#f1f8fb" stroke="#dae8ee" stroke-width="2"/><text x="225" y="198" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" fill="#193448" text-anchor="middle">100 N × 0,40 m</text><text x="225" y="235" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" fill="#dc8b32" text-anchor="middle">40 J</text><rect x="480" y="165" width="290" height="91" rx="8" fill="#f1f8fb" stroke="#dae8ee" stroke-width="2"/><text x="625" y="198" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" fill="#193448" text-anchor="middle">4000 N × 0,01 m</text><text x="625" y="235" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" fill="#218468" text-anchor="middle">40 J</text><text x="420" y="208" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="700" fill="#2782af" text-anchor="middle">=</text><text x="420" y="313" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#218468" text-anchor="middle">F₁ Δx₁ = F₂ Δx₂</text><text x="420" y="352" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#516779" text-anchor="middle">La forza aumenta, ma lo spostamento diminuisce.</text>
</svg>