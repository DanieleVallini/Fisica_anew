<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400" role="img" aria-label="Esempio: una forza 40 volte maggiore">
<rect width="840" height="400" rx="18" fill="white"/>
<rect x="1" y="1" width="838" height="398" rx="17" fill="none" stroke="#dae8ee" stroke-width="2"/>
<text x="30" y="44" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#193448">Esempio: una forza 40 volte maggiore</text>
<text x="30" y="72" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#516779">Le aree sono nel rapporto 200 / 5 = 40</text>
<rect x="160.5" y="160" width="115" height="95" rx="7" fill="#daf1fa" stroke="#2782af" stroke-width="2"/><rect x="160.5" y="148" width="115" height="12" rx="2" fill="#8198a9"/><line x1="218" y1="104" x2="218" y2="143" stroke="#dc8b32" stroke-width="5" stroke-linecap="round"/><path d="M 218 143 L 212.82 133.29 L 223.18 133.29 Z" fill="#dc8b32"/><text x="243" y="111" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#dc8b32">100 N</text><text x="218" y="285" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#193448" text-anchor="middle">A = 5 cm²</text><rect x="493.0" y="160" width="250" height="95" rx="7" fill="#daf1fa" stroke="#2782af" stroke-width="2"/><rect x="493.0" y="148" width="250" height="12" rx="2" fill="#8198a9"/><line x1="618" y1="104" x2="618" y2="143" stroke="#dc8b32" stroke-width="5" stroke-linecap="round"/><path d="M 618 143 L 612.82 133.29 L 623.18 133.29 Z" fill="#dc8b32"/><text x="643" y="111" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#dc8b32">4000 N</text><text x="618" y="285" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" fill="#193448" text-anchor="middle">A = 200 cm²</text><line x1="328" y1="211" x2="482" y2="211" stroke="#218468" stroke-width="4" stroke-linecap="round"/><path d="M 482 211 L 472.29 216.18 L 472.29 205.82 Z" fill="#218468"/><text x="404" y="186" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" fill="#218468" text-anchor="middle">×40</text><text x="420" y="351" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#218468" text-anchor="middle">F₂ = 100 × (200 / 5) = 4000 N</text>
