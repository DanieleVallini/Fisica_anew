"/><rect x="18" y="18" width="864" height="384" rx="14" fill="white" stroke="#D5E5EE" stroke-width="1.5"/><text x="40" y="55" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#19344D">Potenza ed effetto Joule</text><text x="40" y="82" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#56718B">L’energia fornita dalle cariche viene trasformata in calore nella resistenza.</text><rect x="92" y="160" width="190" height="114" rx="10" fill="#E7F3FB" stroke="#267CB3" stroke-width="1.6" opacity="1"/><text x="186" y="201" fill="#267CB3" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Generatore</text><text x="186" y="233" fill="#56718B" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Energia elettrica</text><line x1="294" y1="213" x2="536" y2="213" stroke="#159B91" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-teal)"/><text x="412" y="195" fill="#159B91" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="bold" text-anchor="middle">P = V I</text><rect x="549" y="160" width="235" height="114" rx="10" fill="#FEF0DE" stroke="#DE932E" stroke-width="1.6" opacity="1"/><text x="666" y="200" fill="#19344D" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Resistore R</text><text x="667" y="236" fill="#D65D5F" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="bold" text-anchor="middle">Calore Q</text><text x="155" y="342" fill="#267CB3" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="bold" text-anchor="start">P = I²R</text><text x="450" y="342" fill="#159B91" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="bold" text-anchor="start">P = V² / R</text><text x="155" y="383" fill="#56718B" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" text-anchor="start">E = P Δt  [joule]     •     P [watt]</text></svg>