<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Sovrapposizione del potenziale">
<defs>
<marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#267CB3"/></marker>
<marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#159B91"/></marker>
<marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#D65D5F"/></marker>
<marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#DE932E"/></marker>
<marker id="a-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#19344D"/></marker>
<marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#56718B"/></marker>
</defs>
<rect x="0" y="0" width="900" height="420" rx="16" fill="#F8FBFF"/>
<rect x="18" y="18" width="864" height="384" rx="14" fill="#FFFFFF" stroke="#D5E5EE" stroke-width="1.5"/>
<text x="40" y="56" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#19344D">Sovrapposizione del potenziale</text>
<text x="40" y="83" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#56718B">V si somma algebricamente: non servono componenti vettoriali.</text>
<circle cx="175" cy="205" r="36" fill="#D65D5F"/>
<text x="175" y="216" font-family="DejaVu Sans, sans-serif" font-size="37" font-weight="700" text-anchor="middle" fill="#FFFFFF">+</text>
<circle cx="728" cy="205" r="36" fill="#267CB3"/>
<text x="728" y="216" font-family="DejaVu Sans, sans-serif" font-size="37" font-weight="700" text-anchor="middle" fill="#FFFFFF">-</text>
<circle cx="434" cy="205" r="11" fill="#19344D"/>
<text x="434" y="173" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#19344D">P</text>
<line x1="213" y1="253" x2="423" y2="253" stroke="#56718B" stroke-width="2" stroke-linecap="round"/>
<line x1="444" y1="253" x2="690" y2="253" stroke="#56718B" stroke-width="2" stroke-linecap="round"/>
<text x="315" y="282" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#56718B">r₁</text>
<text x="575" y="282" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#56718B">r₂</text>
<rect x="116" y="307" width="672" height="65" rx="11" fill="#E7F6F3" stroke="#B7DED8" stroke-width="1.5"/>
<text x="450" y="347" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#159B91">V(P) = k · Q₁/r₁ + k · Q₂/r₂</text>
<text x="175" y="153" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#D65D5F">Q₁ &gt; 0</text>
<text x="728" y="153" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#267CB3">Q₂ &lt; 0</text>
</svg>