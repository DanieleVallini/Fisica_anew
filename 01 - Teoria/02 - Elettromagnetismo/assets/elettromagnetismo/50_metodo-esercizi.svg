/><rect x="18" y="18" width="864" height="384" rx="14" fill="white" stroke="#D5E5EE" stroke-width="1.5"/><text x="40" y="55" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#19344D">Metodo per gli esercizi</text><text x="40" y="82" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#56718B">Parti dai dati, identifica il componente, scegli la legge e controlla le unità.</text><rect x="95" y="164" width="155" height="133" rx="12" fill="#F4FAFE" stroke="#D5E5EE" stroke-width="1.6" opacity="1"/><circle cx="122" cy="192" r="17" fill="#267CB3" stroke="none" stroke-width="1.5"/><text x="122" y="198" fill="white" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">1</text><text x="173" y="224" fill="#19344D" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="middle">Dati SI</text><text x="173" y="253" fill="#56718B" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">mA → A, kΩ → Ω</text><rect x="285" y="164" width="155" height="133" rx="12" fill="#F4FAFE" stroke="#D5E5EE" stroke-width="1.6" opacity="1"/><circle cx="312" cy="192" r="17" fill="#267CB3" stroke="none" stroke-width="1.5"/><text x="312" y="198" fill="white" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">2</text><text x="363" y="224" fill="#19344D" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="middle">Identifica</text><text x="363" y="253" fill="#56718B" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">R, V, I oppure P</text><rect x="475" y="164" width="155" height="133" rx="12" fill="#F4FAFE" stroke="#D5E5EE" stroke-width="1.6" opacity="1"/><circle cx="502" cy="192" r="17" fill="#267CB3" stroke="none" stroke-width="1.5"/><text x="502" y="198" fill="white" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">3</text><text x="553" y="224" fill="#19344D" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="middle">Applica</text><text x="553" y="253" fill="#56718B" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">Ohm, ρL/A, potenza</text><rect x="665" y="164" width="155" height="133" rx="12" fill="#F4FAFE" stroke="#D5E5EE" stroke-width="1.6" opacity="1"/><circle cx="692" cy="192" r="17" fill="#267CB3" stroke="none" stroke-width="1.5"/><text x="692" y="198" fill="white" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">4</text><text x="743" y="224" fill="#19344D" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="middle">Controlla</text><text x="743" y="253" fill="#56718B" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">segni e unità</text><line x1="259" y1="230" x2="280" y2="230" stroke="#159B91" stroke-width="2.6" stroke-linecap="round" marker-end="url(#arrow-teal)"/><line x1="449" y1="230" x2="470" y2="230" stroke="#159B91" stroke-width="2.6" stroke-linecap="round" marker-end="url(#arrow-teal)"/><line x1="639" y1="230" x2="660" y2="230" stroke="#159B91" stroke-width="2.6" stroke-linecap="round" marker-end="url(#arrow-teal)"/><text x="450" y="349" fill="#19344D" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" text-anchor="middle">Controllo fisico: aumenta R a tensione fissata → diminuisce I</text></svg>