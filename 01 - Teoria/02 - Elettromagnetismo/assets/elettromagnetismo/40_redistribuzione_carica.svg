<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Ridistribuzione della carica"><defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#267CB3"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#159B91"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#D65D5F"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#DE932E"/></marker><marker id="a-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#19344D"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#56718B"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8B68BB"/></marker></defs><rect x="0" y="0" width="900" height="420" rx="16" fill="#F8FBFF"/><rect x="18" y="18" width="864" height="384" rx="14" fill="#FFFFFF" stroke="#D5E5EE" stroke-width="1.5"/><text x="40" y="56" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#19344D">Ridistribuzione della carica</text><text x="40" y="83" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#56718B">Dopo il collegamento in parallelo, la tensione diventa comune.</text><rect x="54" y="117" width="380" height="260" rx="12" fill="#F4FAFE" stroke="#D5E5EE" stroke-width="1.6"/><rect x="466" y="117" width="380" height="260" rx="12" fill="#F4FAFE" stroke="#D5E5EE" stroke-width="1.6"/><rect x="195" y="130" width="100" height="30" rx="15" fill="#267CB3"/><text x="245.0" y="151" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF">PRIMA</text><rect x="605" y="130" width="100" height="30" rx="15" fill="#159B91"/><text x="655.0" y="151" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF">DOPO</text><text x="240" y="203" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#19344D">C₁ = 4 μF  ·  100 V</text><text x="240" y="236" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#19344D">C₂ = 6 μF  ·  0 V</text><text x="240" y="288" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#56718B">U iniziale</text><text x="240" y="324" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#267CB3">20 mJ</text><text x="655" y="203" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#19344D">Entrambi a 40 V</text><text x="655" y="247" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#56718B">Ceq = 10 μF</text><text x="655" y="288" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#56718B">U finale</text><text x="655" y="324" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#159B91">8 mJ</text><line x1="438" y1="235" x2="462" y2="235" stroke="#DE932E" stroke-width="3" stroke-linecap="round" marker-end="url(#a-amber)"/><text x="450" y="392" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#56718B">La carica del nodo si conserva; la differenza di energia viene dissipata.</text></svg>