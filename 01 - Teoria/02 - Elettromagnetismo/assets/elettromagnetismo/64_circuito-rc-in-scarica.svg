" stroke-width="2.5" stroke-linecap="round"/><line x1="665" y1="181" x2="665" y2="231" stroke="#19344D" stroke-width="2.5" stroke-linecap="round"/><line x1="636" y1="231" x2="694" y2="231" stroke="#19344D" stroke-width="3.4" stroke-linecap="round"/><line x1="636" y1="257" x2="694" y2="257" stroke="#19344D" stroke-width="3.4" stroke-linecap="round"/><line x1="665" y1="257" x2="665" y2="307" stroke="#19344D" stroke-width="2.5" stroke-linecap="round"/><text x="703" y="248" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#19344D">C</text><text x="620" y="223" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#D65D5F">+</text><text x="620" y="276" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#267CB3">−</text><line x1="665" y1="307" x2="665" y2="319" stroke="#19344D" stroke-width="2.5" stroke-linecap="round"/><line x1="490" y1="128" x2="440" y2="128" stroke="#D65D5F" stroke-width="3" stroke-linecap="round" marker-end="url(#arr-red)"/><text x="464" y="115" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#D65D5F">I_scarica</text><text x="249" y="227" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#267CB3">V_C ↓</text><text x="249" y="260" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#56718B">Il campo elettrico</text><text x="249" y="286" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#56718B">del condensatore si riduce.</text><text x="450" y="388" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#267CB3">Senza sorgente: R I_scarica = V_C</text></svg>