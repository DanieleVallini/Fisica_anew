FBFF"/><rect x="18" y="18" width="864" height="384" rx="14" fill="white" stroke="#D5E5EE" stroke-width="1.5"/><text x="40" y="55" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#19344D">Legge dei nodi (Kirchhoff I)</text><text x="40" y="82" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#56718B">La carica non si accumula nel nodo in regime stazionario.</text><line x1="154" y1="220" x2="396" y2="220" stroke="#159B91" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-teal)"/><line x1="310" y1="130" x2="427" y2="212" stroke="#159B91" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-teal)"/><line x1="443" y1="220" x2="715" y2="220" stroke="#267CB3" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-blue)"/><circle cx="427" cy="220" r="12" fill="#19344D" stroke="none" stroke-width="1.5"/><text x="235" y="201" fill="#159B91" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="bold" text-anchor="middle">I₁ = 3 A</text><text x="327" y="124" fill="#159B91" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="bold" text-anchor="middle">I₂ = 2 A</text><text x="589" y="201" fill="#267CB3" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="bold" text-anchor="middle">I₃ = 5 A</text><rect x="211" y="287" width="495" height="68" rx="12" fill="#EFF8F6" stroke="#159B91" stroke-width="1.6"/><text x="460" y="328" fill="#19344D" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">I₁ + I₂ = I₃   →   3 + 2 = 5</text></svg>