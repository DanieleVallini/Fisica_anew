F8FBFF"/><rect x="18" y="18" width="864" height="384" rx="14" fill="white" stroke="#D5E5EE" stroke-width="1.5"/><text x="40" y="55" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#19344D">Da cosa dipende la resistenza?</text><text x="40" y="82" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#56718B">Materiale, lunghezza e area della sezione determinano la resistenza.</text><rect x="100" y="153" width="550" height="84" rx="20" fill="#DFEDF6" stroke="#267CB3" stroke-width="2.4" opacity="1"/><rect x="620" y="153" width="30" height="84" rx="11" fill="#C2DDEB" stroke="#267CB3" stroke-width="2" opacity="1"/><line x1="142" y1="177" x2="594" y2="177" stroke="#159B91" stroke-width="1.8" stroke-linecap="round"/><line x1="142" y1="192" x2="594" y2="192" stroke="#159B91" stroke-width="1.8" stroke-linecap="round"/><line x1="142" y1="208" x2="594" y2="208" stroke="#159B91" stroke-width="1.8" stroke-linecap="round"/><line x1="110" y1="268" x2="635" y2="268" stroke="#56718B" stroke-width="1.8" stroke-linecap="round"/><line x1="110" y1="261" x2="110" y2="275" stroke="#56718B" stroke-width="2" stroke-linecap="round"/><line x1="635" y1="261" x2="635" y2="275" stroke="#56718B" stroke-width="2" stroke-linecap="round"/><text x="374" y="296" fill="#267CB3" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">L = lunghezza</text><text x="686" y="190" fill="#D65D5F" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="bold" text-anchor="start">A</text><text x="666" y="221" fill="#56718B" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" text-anchor="start">sezione</text><text x="115" y="345" fill="#267CB3" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="bold" text-anchor="start">R = ρ · L / A</text><text x="520" y="346" fill="#19344D" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" text-anchor="start">L ↑ ⇒ R ↑     A ↑ ⇒ R ↓</text></svg>