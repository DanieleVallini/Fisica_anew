FF"/><rect x="18" y="18" width="864" height="384" rx="14" fill="white" stroke="#D5E5EE" stroke-width="1.5"/><text x="40" y="55" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#19344D">Legge di Ohm e grafico I–V</text><text x="40" y="82" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#56718B">Per un componente ohmico a temperatura costante, I è proporzionale a V.</text><line x1="195" y1="337" x2="195" y2="125" stroke="#19344D" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow-navy)"/><line x1="195" y1="337" x2="630" y2="337" stroke="#19344D" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow-navy)"/><text x="173" y="133" fill="#19344D" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="bold" text-anchor="start">I</text><text x="645" y="349" fill="#19344D" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="bold" text-anchor="start">V</text><circle cx="285" cy="283" r="5" fill="#159B91" stroke="none" stroke-width="1.5"/><circle cx="375" cy="229" r="5" fill="#159B91" stroke="none" stroke-width="1.5"/><circle cx="465" cy="175" r="5" fill="#159B91" stroke="none" stroke-width="1.5"/><circle cx="555" cy="121" r="5" fill="#159B91" stroke="none" stroke-width="1.5"/><line x1="195" y1="337" x2="555" y2="121" stroke="#159B91" stroke-width="3.8" stroke-linecap="round"/><path d="M195 337 C300 329,365 322,425 305 S520 225,575 143" fill="none" stroke="#D65D5F" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/><text x="670" y="175" fill="#159B91" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Ohmico:</text><text x="670" y="200" fill="#56718B" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" text-anchor="start">retta</text><text x="670" y="257" fill="#D65D5F" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Non ohmico:</text><text x="670" y="283" fill="#56718B" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="normal" text-anchor="start">curva</text><text x="280" y="382" fill="#56718B" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="normal" text-anchor="start">La pendenza di I(V) vale 1/R nel caso ohmico.</text></svg>