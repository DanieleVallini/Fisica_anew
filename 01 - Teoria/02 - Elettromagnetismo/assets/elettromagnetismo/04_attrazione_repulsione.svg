<text x="245" y="153" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#19344D">Stesso segno → repulsione</text>
<circle cx="174" cy="240" r="35" fill="#D65D5F"/>
<text x="174" y="252" font-family="DejaVu Sans, sans-serif" font-size="40" font-weight="700" text-anchor="middle" fill="#FFFFFF">+</text>
<circle cx="310" cy="240" r="35" fill="#D65D5F"/>
<text x="310" y="252" font-family="DejaVu Sans, sans-serif" font-size="40" font-weight="700" text-anchor="middle" fill="#FFFFFF">+</text>
<line x1="130" y1="240" x2="78" y2="240" stroke="#D65D5F" stroke-width="4" stroke-linecap="round" marker-end="url(#a-red)"/>
<line x1="352" y1="240" x2="409" y2="240" stroke="#D65D5F" stroke-width="4" stroke-linecap="round" marker-end="url(#a-red)"/>
<text x="246" y="321" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#19344D">Le forze puntano verso l’esterno</text>
<text x="660" y="153" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#19344D">Segni opposti → attrazione</text>
<circle cx="588" cy="240" r="35" fill="#D65D5F"/>
<text x="588" y="252" font-family="DejaVu Sans, sans-serif" font-size="40" font-weight="700" text-anchor="middle" fill="#FFFFFF">+</text>
<circle cx="736" cy="240" r="35" fill="#267CB3"/>
<text x="736" y="252" font-family="DejaVu Sans, sans-serif" font-size="40" font-weight="700" text-anchor="middle" fill="#FFFFFF">-</text>
<line x1="632" y1="240" x2="672" y2="240" stroke="#159B91" stroke-width="4" stroke-linecap="round" marker-end="url(#a-teal)"/>
<line x1="693" y1="240" x2="654" y2="240" stroke="#159B91" stroke-width="4" stroke-linecap="round" marker-end="url(#a-teal)"/>
<text x="660" y="321" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#19344D">Le forze puntano l’una verso l’altra</text>
