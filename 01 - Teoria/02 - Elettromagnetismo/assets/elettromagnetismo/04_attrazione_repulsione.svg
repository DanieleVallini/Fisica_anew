<rect x="0" y="0" width="900" height="420" rx="16" fill="#F8FBFF"/>
<rect x="18" y="18" width="864" height="384" rx="14" fill="#FFFFFF" stroke="#D5E5EE" stroke-width="1.5"/>
<text x="40" y="56" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#19344D">Coulomb: attrazione e repulsione</text>
<text x="40" y="83" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#56718B">La forza agisce sulla retta che congiunge le cariche.</text>
<rect x="49" y="113" width="391" height="248" rx="12" fill="#FFF3E1" stroke="#D5E5EE" stroke-width="1.5"/>
