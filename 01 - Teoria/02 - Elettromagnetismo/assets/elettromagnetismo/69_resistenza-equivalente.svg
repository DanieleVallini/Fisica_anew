<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Resistenze equivalenti e costante di tempo"><defs><marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#267CB3"/></marker><marker id="arr-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#159B91"/></marker><marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#D65D5F"/></marker></defs><rect width="900" height="420" rx="18" fill="#F8FBFF"/><rect x="18" y="18" width="864" height="384" rx="14" fill="white" stroke="#D5E5EE" stroke-width="1.5"/><text x="40" y="55" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#19344D">Resistenze equivalenti e costante di tempo</text><text x="40" y="82" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#56718B">Con un solo condensatore e resistori in serie, si usa R_eq per trovare τ.</text><line x1="130" y1="143" x2="206" y2="143" stroke="#19344D" stroke-width="2.5" stroke-linecap="round"/><line x1="210" y1="143" x2="230" y2="143" stroke="#19344D" stroke-width="2.5" stroke-linecap="round"/><rect x="230" y="130" width="60" height="26" rx="3" fill="white" stroke="#267CB3" stroke-width="2.4"/><line x1="290" y1="143" x2="310" y2="143" stroke="#19344D" stroke-width="2.5" stroke-linecap="round"/><text x="260" y="118" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#19344D">R₁ = 2 kΩ</text><line x1="310" y1="143" x2="420" y2="143" stroke="#19344D" stroke-width="2.5" stroke-linecap="round"/><line x1="424" y1="143" x2="444" y2="143" stroke="#19344D" stroke-width="2.5" stroke-linecap="round"/><rect x="444" y="130" width="60" height="26" rx="3" fill="white" stroke="#267CB3" stroke-width="2.4"/><line x1="504" y1="143" x2="524" y2="143" stroke="#19344D" stroke-width="2.5" stroke-linecap="round"/><text x="474" y="118" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#19344D">R₂ = 3 kΩ</text><line x1="524" y1="143" x2="680" y2="143" stroke="#19344D" stroke-width="2.5" stroke-linecap="round"/><line x1="130" y1="143" x2="130" y2="209" stroke="#19344D" stroke-width="2.5" stroke-linecap="round"/><line x1="130" y1="193" x2="130" y2="237" stroke="#19344D" stroke-width="2.5" stroke-linecap="round"/><line x1="106" y1="237" x2="154" y2="237" stroke="#19344D" stroke-width="3.4" stroke-linecap="round"/><line x1="117" y1="275" x2="143" y2="275" stroke="#19344D" stroke-width="3.4" stroke-linecap="round"/><line x1="130" y1="275" x2="130" y2="324" stroke="#19344D" stroke-width="2.5" stroke-linecap="round"/><text x="91" y="239" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#D65D5F">+</text><text x="91" y="280" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#56718B">−</text><text x="77" y="262" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="end" fill="#159B91">12 V</text><line x1="130" y1="324" x2="130" y2="343" stroke="#19344D" stroke-width="2.5" stroke-linecap="round"/><line x1="680" y1="143" x2="680" y2="197" stroke="#19344D" stroke-width="2.5" stroke-linecap="round"/><line x1="680" y1="197" x2="680" y2="247" stroke="#19344D" stroke-width="2.5" stroke-linecap="round"/><line x1="651" y1="247" x2="709" y2="247" stroke="#19344D" stroke-width="3.4" stroke-linecap="round"/><line x1="651" y1="273" x2="709" y2="273" stroke="#19344D" stroke-width="3.4" stroke-linecap="round"/><line x1="680" y1="273" x2="680" y2="323" stroke="#19344D" stroke-width="2.5" stroke-linecap="round"/><text x="718" y="264" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#19344D">C = 100 µF</text><text x="635" y="239" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#D65D5F">+</text><text x="635" y="292" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#267CB3">−</text><line x1="680" y1="323" x2="680" y2="343" stroke="#19344D" stroke-width="2.5" stroke-linecap="round"/><line x1="130" y1="343" x2="680" y2="343" stroke="#19344D" stroke-width="2.5" stroke-linecap="round"/><text x="350" y="222" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#267CB3">R_eq = R₁ + R₂ = 5 kΩ</text><text x="350" y="257" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#159B91">τ = R_eq C = 0,50 s</text><text x="450" y="388" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#267CB3">Prima si riduce la rete resistiva, poi si calcola τ</text></svg>