-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="end">12 V</text><line x1="130" y1="292" x2="130" y2="341" stroke="#19344D" stroke-width="2.5" stroke-linecap="round"/><line x1="130" y1="341" x2="677" y2="341" stroke="#19344D" stroke-width="2.5" stroke-linecap="round"/><line x1="433" y1="145" x2="433" y2="200" stroke="#19344D" stroke-width="2.5" stroke-linecap="round"/><line x1="433" y1="200" x2="433" y2="217" stroke="#19344D" stroke-width="2.5" stroke-linecap="round"/><rect x="420" y="217" width="26" height="56" rx="3" fill="white" stroke="#267CB3" stroke-width="2.4"/><line x1="433" y1="273" x2="433" y2="290" stroke="#19344D" stroke-width="2.5" stroke-linecap="round"/><text x="457" y="251" fill="#19344D" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start">R₃ = 2 Ω</text><line x1="433" y1="290" x2="433" y2="341" stroke="#19344D" stroke-width="2.5" stroke-linecap="round"/><line x1="677" y1="145" x2="677" y2="200" stroke="#19344D" stroke-width="2.5" stroke-linecap="round"/><line x1="677" y1="200" x2="677" y2="217" stroke="#19344D" stroke-width="2.5" stroke-linecap="round"/><rect x="664" y="217" width="26" height="56" rx="3" fill="white" stroke="#267CB3" stroke-width="2.4"/><line x1="677" y1="273" x2="677" y2="290" stroke="#19344D" stroke-width="2.5" stroke-linecap="round"/><text x="701" y="251" fill="#19344D" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="start">R₂ = 4 Ω</text><line x1="677" y1="290" x2="677" y2="341" stroke="#19344D" stroke-width="2.5" stroke-linecap="round"/><circle cx="433" cy="145" r="5" fill="#19344D" stroke="none" stroke-width="1.5"/><circle cx="677" cy="145" r="5" fill="#19344D" stroke="none" stroke-width="1.5"/><text x="521" y="130" fill="#159B91" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="bold" text-anchor="start">V = 4,8 V</text><text x="524" y="363" fill="#56718B" font-family="DejaVu Sans, sans-serif" font-size