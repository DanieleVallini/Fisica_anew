<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Intensità di corrente"><defs><marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" viewBox="0 0 9 9" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#267CB3"/></marker><marker id="arrow-teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" viewBox="0 0 9 9" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#159B91"/></marker><marker id="arrow-red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" viewBox="0 0 9 9" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#D65D5F"/></marker><marker id="arrow-amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" viewBox="0 0 9 9" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#DE932E"/></marker><marker id="arrow-navy" markerWidth="9" markerHeight="9" refX="8" refY="4.5" viewBox="0 0 9 9" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#19344D"/></marker><marker id="arrow-muted" markerWidth="9" markerHeight="9" refX="8" refY="4.5" viewBox="0 0 9 9" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#56718B"/></marker><marker id="arrow-violet" markerWidth="9" markerHeight="9" refX="8" refY="4.5" viewBox="0 0 9 9" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#8B68BB"/></marker><marker id="arrow-line" markerWidth="9" markerHeight="9" refX="8" refY="4.5" viewBox="0 0 9 9" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#D5E5EE"/></marker><marker id="arrow-panel" markerWidth="9" markerHeight="9" refX="8" refY="4.5" viewBox="0 0 9 9" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#F4FAFE"/></marker><marker id="arrow-paper" markerWidth="9" markerHeight="9" refX="8" refY="4.5" viewBox="0 0 9 9" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#F8FBFF"/></marker><marker id="arrow-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" viewBox="0 0 9 9" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#28865D"/></marker></defs><rect width="900" height="420" rx="18" fill="#F8FBFF"/><rect x="18" y="18" width="864" height="384" rx="14" fill="white" stroke="#D5E5EE" stroke-width="1.5"/><text x="40" y="55" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#19344D">Intensità di corrente</text><text x="40" y="82" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#56718B">La corrente misura quanta carica attraversa una sezione per unità di tempo.</text><rect x="85" y="142" width="730" height="150" rx="12" fill="#EAF5FD" stroke="#D5E5EE" stroke-width="1.6" opacity="1"/><rect x="505" y="137" width="22" height="160" rx="4" fill="#B9DBED" stroke="#267CB3" stroke-width="2" opacity="1"/><line x1="145" y1="212" x2="480" y2="212" stroke="#159B91" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-teal)"/><circle cx="210" cy="174" r="10" fill="#DE932E" stroke="none" stroke-width="1.5"/><circle cx="275" cy="230" r="10" fill="#DE932E" stroke="none" stroke-width="1.5"/><circle cx="350" cy="179" r="10" fill="#DE932E" stroke="none" stroke-width="1.5"/><circle cx="412" cy="239" r="10" fill="#DE932E" stroke="none" stroke-width="1.5"/><text x="515" y="123" fill="#19344D" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="bold" text-anchor="middle">Sezione A</text><text x="218" y="198" fill="#19344D" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="normal" text-anchor="start">Carica che attraversa A</text><text x="255" y="347" fill="#267CB3" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="bold" text-anchor="middle">I = Δq / Δt</text><text x="613" y="345" fill="#159B91" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">1 A = 1 C/s</text></svg>