<text x="387" y="190" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#159B91">Campo E</text>
<text x="685" y="224" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#D65D5F">Forza su q₀</text>
<text x="575" y="317" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#19344D">Prova q₀ positiva</text>
