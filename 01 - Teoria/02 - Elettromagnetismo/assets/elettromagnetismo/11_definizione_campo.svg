<text x="210" y="318" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#19344D">Sorgente Q positiva</text>
<circle cx="575" cy="238" r="27" fill="#DE932E"/>
<text x="575" y="247" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" text-anchor="middle" fill="#FFFFFF">+</text>
