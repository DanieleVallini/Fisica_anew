 <text x="40" y="54" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#19344D">Frigorifero: calore dal freddo al caldo</text><text x="40" y="80" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#56718B">Per sottrarre QC alla sorgente fredda serve un lavoro esterno Lin.</text><rect x="344" y="112" width="241" height="57" rx="11" fill="#FFF0DC" stroke="#ECC18C" stroke-width="1.8"/><text x="464" y="146" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#D65D5F">SORGENTE CALDA</text><rect x="346" y="222" width="237" height="64" rx="11" fill="#ECF5FB" stroke="#BED8E6" stroke-width="1.8"/><text x="464" y="260" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#19344D">FRIGORIFERO</text><rect x="343" y="348" width="245" height="49" rx="10" fill="#E7F3FD" stroke="#9FC7E5" stroke-width="1.8"/><text x="464" y="379" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#267CB3">SORGENTE FREDDA</text><line x1="461" y1="344" x2="461" y2="290" stroke="#267CB3" stroke-width="5" stroke-linecap="round" marker-end="url(#ab)"/><text x="481" y="329" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#267CB3">QC</text><line x1="461" y1="218" x2="461" y2="174" stroke="#D65D5F" stroke-width="5" stroke-linecap="round" marker-end="url(#ar)"/><text x="481" y="208" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#D65D5F">QH</text><line x1="102" y1="252" x2="331" y2="252" stroke="#DE932E" stroke-width="5" stroke-linecap="round" marker-end="url(#aa)"/><text x="209" y="227" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#DE932E">Lavoro in ingresso</text><rect x="625" y="217" width="217" height="99" rx="10" fill="#F6F9FC"