<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" role="img" aria-label="Trasformazione adiabatica"><rect x="0" y="0" width="900" height="410" rx="18" fill="#ffffff"/><rect x="16" y="15" width="868" height="378" rx="16" fill="#f2f8fb" stroke="#d8e8ed" stroke-width="2"/><text x="42" y="53" fill="#112a3d" font-family="DejaVu Sans, Arial" font-weight="700" font-size="24">Trasformazione adiabatica</text><text x="42" y="78" fill="#5a6c79" font-family="DejaVu Sans, Arial" font-size="14">Nessuno scambio di calore; la reversibile è più ripida dell’isoterma.</text><line x1="100" y1="322" x2="488" y2="322" stroke="#112a3d" stroke-width="2" stroke-linecap="round" /><polygon points="488,322 478.3,327.3 478.3,316.7" fill="#112a3d"/><line x1="100" y1="322" x2="100" y2="106" stroke="#112a3d" stroke-width="2" stroke-linecap="round" /><polygon points="100,106 105.3,115.7 94.7,115.7" fill="#112a3d"/><text x="81" y="101" font-family="DejaVu Sans, Arial" font-size="20" fill="#112a3d" text-anchor="start" font-weight="normal">p</text><text x="500" y="327" font-family="DejaVu Sans, Arial" font-size="20" fill="#112a3d" text-anchor="start" font-weight="normal">V</text><path d="M 150 145 C 185 185 267 248 445 276" stroke="#1e81b0" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 8"/><path d="M 150 145 C 182 222 233 276 445 308" stroke="#7966bd" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="150" cy="145" rx="5" ry="5" fill="#7966bd" stroke="#7966bd" stroke-width="2"/><text x="180" y="190" font-family="DejaVu Sans, Arial" font-size="18" fill="#1e81b0" text-anchor="start" font-weight="normal">Isoterma</text><text x="226" y="307" font-family="DejaVu Sans, Arial" font-size="18" fill="#7966bd" text-anchor="start" font-weight="normal">Adiabatica</text><text x="250" y="348" font-family="DejaVu Sans, Arial" font-size="14" fill="#5a6c79" text-anchor="middle" font-weight="normal">Stesso stato iniziale, espansione</text><rect x="545" y="130" width="291" height="212" rx="10" fill="#ffffff" stroke="#d7d7e9" stroke-width="2"/><text x="568" y="169" font-family="DejaVu Sans, Arial" font-size="24" fill="#7966bd" text-anchor="start" font-weight="bold">Q = 0</text><text x="568" y="206" font-family="DejaVu Sans, Arial" font-size="21" fill="#112a3d" text-anchor="start" font-weight="normal">ΔU = −L</text><text x="568" y="245" font-family="DejaVu Sans, Arial" font-size="21" fill="#112a3d" text-anchor="start" font-weight="normal">pVᵞ = costante</text><text x="568" y="281" font-family="DejaVu Sans, Arial" font-size="18" fill="#112a3d" text-anchor="start" font-weight="normal">T V⁽ᵞ⁻¹⁾ = costante</text><text x="568" y="319" font-family="DejaVu Sans, Arial" font-size="14" fill="#5a6c79" text-anchor="start" font-weight="normal">Solo reversibile, γ costante</text></svg>