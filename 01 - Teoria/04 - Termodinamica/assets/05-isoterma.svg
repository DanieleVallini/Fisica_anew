<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" role="img" aria-label="Trasformazione isoterma"><rect x="0" y="0" width="900" height="410" rx="18" fill="#ffffff"/><rect x="16" y="15" width="868" height="378" rx="16" fill="#f2f8fb" stroke="#d8e8ed" stroke-width="2"/><text x="42" y="53" fill="#112a3d" font-family="DejaVu Sans, Arial" font-weight="700" font-size="24">Trasformazione isoterma</text><text x="42" y="78" fill="#5a6c79" font-family="DejaVu Sans, Arial" font-size="14">Gas perfetto: curva iperbolica; (*) lavoro isoterma reversibile.</text><line x1="90" y1="320" x2="455" y2="320" stroke="#112a3d" stroke-width="2" stroke-linecap="round" /><polygon points="455,320 445.3,325.3 445.3,314.7" fill="#112a3d"/><line x1="90" y1="320" x2="90" y2="106" stroke="#112a3d" stroke-width="2" stroke-linecap="round" /><polygon points="90,106 95.3,115.7 84.7,115.7" fill="#112a3d"/><text x="71" y="101" font-family="DejaVu Sans, Arial" font-size="20" fill="#112a3d" text-anchor="start" font-weight="normal">p</text><text x="467" y="325" font-family="DejaVu Sans, Arial" font-size="20" fill="#112a3d" text-anchor="start" font-weight="normal">V</text><path d="M 147 144 C 188 190 240 237 415 286" stroke="#1e81b0" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="170" cy="169" rx="6" ry="6" fill="#1e81b0" stroke="#1e81b0" stroke-width="2"/><ellipse cx="385" cy="275" rx="6" ry="6" fill="#1e81b0" stroke="#1e81b0" stroke-width="2"/><line x1="228" y1="215" x2="281" y2="240" stroke="#1e81b0" stroke-width="5" stroke-linecap="round" /><polygon points="281,240 270.0,240.7 274.5,231.1" fill="#1e81b0"/><text x="156" y="153" font-family="DejaVu Sans, Arial" font-size="16" fill="#112a3d" text-anchor="start" font-weight="normal">A</text><text x="399" y="271" font-family="DejaVu Sans, Arial" font-size="16" fill="#112a3d" text-anchor="start" font-weight="normal">B</text><rect x="516" y="128" width="316" height="215" rx="12" fill="#ffffff" stroke="#c8dee7" stroke-width="2"/><text x="545" y="172" font-family="DejaVu Sans, Arial" font-size="23" fill="#1e81b0" text-anchor="start" font-weight="bold">T = costante</text><text x="545" y="212" font-family="DejaVu Sans, Arial" font-size="20" fill="#112a3d" text-anchor="start" font-weight="normal">p₁V₁ = p₂V₂</text><text x="545" y="248" font-family="DejaVu Sans, Arial" font-size="20" fill="#148e78" text-anchor="start" font-weight="normal">ΔU = 0</text><text x="545" y="287" font-family="DejaVu Sans, Arial" font-size="20" fill="#dd8147" text-anchor="start" font-weight="normal">Q = L</text><text x="545" y="322" font-family="DejaVu Sans, Arial" font-size="16" fill="#5a6c79" text-anchor="start" font-weight="normal">L = nRT ln(V₂/V₁) (*)</text></svg>