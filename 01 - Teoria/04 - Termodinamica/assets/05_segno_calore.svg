<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
    <rect width="640" height="320" fill="white"/>
    <rect x="12" y="12" width="616" height="296" rx="18" fill="#f6f9fc" stroke="#e2eaf1"/>
    <g font-family="DejaVu Sans,Arial,sans-serif">
    <text x="34" y="46" font-size="22" text-anchor="start" font-weight="700" fill="#183955">Calore con segno: assorbito o ceduto</text><text x="34" y="69" font-size="12" text-anchor="start" font-weight="400" fill="#64798a">Per ogni corpo usa sempre la differenza T_f − T_i</text><rect x="38" y="103" width="265" height="150" rx="8" fill="#dbeffa" stroke="#bad8ec" stroke-width="1"/><rect x="337" y="103" width="265" height="150" rx="8" fill="#fde8e6" stroke="#f0bdb5" stroke-width="1"/><text x="170" y="140" font-size="18" text-anchor="middle" font-weight="700" fill="#3178B8">Riscaldamento</text><text x="470" y="140" font-size="18" text-anchor="middle" font-weight="700" fill="#C85C5C">Raffreddamento</text><text x="170" y="185" font-size="19" text-anchor="middle" font-weight="400" fill="#3178B8">T_f &gt; T_i</text><text x="470" y="185" font-size="19" text-anchor="middle" font-weight="400" fill="#C85C5C">T_f &lt; T_i</text><text x="170" y="222" font-size="16" text-anchor="middle" font-weight="700" fill="#3178B8">Q &gt; 0 : assorbe</text><text x="470" y="222" font-size="16" text-anchor="middle" font-weight="700" fill="#C85C5C">Q &lt; 0 : cede</text><text x="320" y="288" font-size="14" text-anchor="middle" font-weight="400" fill="#203344">Il segno è contenuto in ΔT = T_f − T_i</text></g></svg>