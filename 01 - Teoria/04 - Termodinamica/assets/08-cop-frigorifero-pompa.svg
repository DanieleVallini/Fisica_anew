 <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#159B91"/></marker>
 <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#D65D5F"/></marker>
 <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#DE932E"/></marker>
 </defs><rect width="900" height="420" rx="16" fill="#F8FBFF"/><rect x="18" y="18" width="864" height="384" rx="14" fill="white" stroke="#DFEAF2" stroke-width="1.5"/>
 <text x="40" y="54" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#19344D">COP: frigorifero e pompa di calore</text><text x="40" y="80" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#56718B">Stesso dispositivo fisico, ma cambia il calore utile preso come obiettivo.</text><rect x="55" y="112" width="383" height="241" rx="13" fill="#F5F9FC" stroke="#CCDFE9" stroke-width="1.8"/><rect x="66" y="126" width="8" height="214" rx="3" fill="#267CB3" stroke="#267CB3" stroke-width="0"/><text x="250" y="157" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#267CB3">FRIGORIFERO</text><text x="250" y="209" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#19344D">COPF = QC / Lin</text><text x="250" y="256" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#56718B">Conta il calore sottratto</text><rect x="97" y="288" width="301" height="41" rx="8" fill="#ECF5F8" stroke="#C7DBE9" stroke-width="1.8"/><text x="250" y="315" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#267CB3">COP può superare 1</text><rect x="461" y="112" width="383" height="241" rx="13" fill="#F5F9FC" stroke="#CCDFE9" stroke-width="1.8"/><rect x="472" y="126" width="8" height="214" rx="3" fill="#159B91" stroke="#159B91" stroke-width="0"/><text x="656" y="157" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#159B91">POMPA DI CALORE</text><text x="656" y="209" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#19344D">COPP = QH / Lin</text><text x="656" y="256" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#56718B">Conta il calore fornito</text><rect x="503" y="288" width="301" height="41" rx="8" fill="#ECF5F8" stroke="#C7DBE9" stroke-width="1.8"/><text x="656" y="315" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#159B91">COPP = COPF + 1</text></svg>