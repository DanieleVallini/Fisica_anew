 <text x="40" y="54" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#19344D">Entropia nel trasferimento spontaneo di calore</text><text x="40" y="80" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#56718B">Il caldo perde entropia, il freddo ne acquista di più: la somma è positiva.</text><rect x="51" y="130" width="262" height="160" rx="14" fill="#FFF2E5" stroke="#E6BE90" stroke-width="1.8"/><rect x="588" y="130" width="262" height="160" rx="14" fill="#E9F4FE" stroke="#B2D3E6" stroke-width="1.8"/><text x="181" y="164" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#D65D5F">SORGENTE CALDA</text><text x="181" y="196" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#19344D">400 K</text><text x="181" y="238" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#D65D5F">ΔS = −0,25 J/K</text><text x="720" y="164" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#267CB3">SORGENTE FREDDA</text><text x="720" y="196" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#19344D">300 K</text><text x="720" y="238" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#267CB3">ΔS = +0,333 J/K</text><line x1="327" y1="195" x2="573" y2="195" stroke="#D65D5F" stroke-width="6" stroke-linecap="round" marker-end="url(#ar)"/><text x="450" y="169" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#D65D5F">q = 100 J</text><rect x="232" y="322" width="440" height="55" rx="10" fill="#E7F6F3" stroke="#B3DACE" stroke-width="1.8"/><text x="450" y="356" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#159B91">ΔStot = +0,0833 J/K &gt; 0</text></svg>