    <text x="34" y="46" font-size="22" text-anchor="start" font-weight="700" fill="#183955">Verso dello scambio di calore</text><text x="34" y="69" font-size="12" text-anchor="start" font-weight="400" fill="#64798a">Due corpi isolati raggiungono una temperatura comune</text><rect x="45" y="110" width="180" height="115" rx="8" fill="#fde8e6" stroke="#efc0bb" stroke-width="1"/><rect x="415" y="110" width="180" height="115" rx="8" fill="#dbeffa" stroke="#aaccdf" stroke-width="1"/><text x="135" y="152" font-size="27" text-anchor="middle" font-weight="700" fill="#C85C5C">80 °C</text><text x="505" y="152" font-size="27" text-anchor="middle" font-weight="700" fill="#3178B8">20 °C</text><line x1="245" y1="163" x2="395" y2="163" stroke="#ec9b3a" stroke-width="5" stroke-linecap="round"/><path d="M395 163 L384.52706590825096 168.8581269625949 L384.52706590825096 157.1418730374051 Z" fill="#ec9b3a"/><text x="318" y="147" font-size="15" text-anchor="middle" font-weight="400" fill="#ec9b3a">calore</text><text x="135" y="198" font-size="18" text-anchor="middle" font-weight="400" fill="#C85C5C">A</text><text x="505" y="198" font-size="18" text-anchor="middle" font-weight="400" fill="#3178B8">B</text><line x1="320" y1="224" x2="320" y2="249" stroke="#64798a" stroke-width="2" stroke-linecap="round"/><line x1="320" y1="249" x2="320" y2="265" stroke="#64798a" stroke-width="3" stroke-linecap="round"/><path d="M320 265 L314.1418730374051 254.527065908251 L325.8581269625949 254.527065908251 Z" fill="#64798a"/><rect x="155" y="269" width="330" height="31" rx="11" fill="#def2e8" stroke="#b2ddc6" stroke-width="1"/><text x="320" y="290" font-size="13" text-anchor="middle" font-weight="700" fill="#2f8d66">Equilibrio: T_A = T_B, flusso netto nullo</text></g></svg>