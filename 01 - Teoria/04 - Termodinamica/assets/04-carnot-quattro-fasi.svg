<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Le quattro trasformazioni del ciclo di Carnot"><defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#267CB3"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#159B91"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#D65D5F"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#DE932E"/></marker><marker id="a-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#19344D"/></marker></defs><rect x="0" y="0" width="900" height="420" rx="16" fill="#F8FBFF"/><rect x="18" y="18" width="864" height="384" rx="14" fill="#FFFFFF" stroke="#D5E5EE" stroke-width="1.5"/><text x="40" y="56" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#19344D">Le quattro trasformazioni del ciclo di Carnot</text><text x="40" y="83" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#56718B">Per il gas perfetto: due isoterme e due adiabatiche reversibili, percorse in successione.</text><rect x="52" y="116" width="393" height="114" rx="12" fill="#F4F9FC" stroke="#D5E5EE" stroke-width="1.5"/><rect x="65" y="129" width="93" height="32" rx="7" fill="#FFF3E1"/><text x="111" y="151" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#D65D5F">1 → 2</text><text x="171" y="152" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#D65D5F">ISOTERMA CALDA</text><text x="76" y="184" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#19344D">T = TH costante</text><text x="76" y="211" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#56718B">QH entra • espansione</text><rect x="478" y="116" width="393" height="114" rx="12" fill="#F4F9FC" stroke="#D5E5EE" stroke-width="1.5"/><rect x="491" y="129" width="93" height="32" rx="7" fill="#FFF3E1"/><text x="537" y="151" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#DE932E">2 → 3</text><text x="597" y="152" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#DE932E">ADIABATICA</text><text x="502" y="184" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#19344D">Q = 0</text><text x="502" y="211" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#56718B">Espansione • T diminuisce</text><rect x="52" y="252" width="393" height="114" rx="12" fill="#F4F9FC" stroke="#D5E5EE" stroke-width="1.5"/><rect x="65" y="265" width="93" height="32" rx="7" fill="#E3F3FE"/><text x="111" y="287" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#267CB3">3 → 4</text><text x="171" y="288" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#267CB3">ISOTERMA FREDDA</text><text x="76" y="320" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#19344D">T = TC costante</text><text x="76" y="347" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#56718B">QC esce • compressione</text><rect x="478" y="252" width="393" height="114" rx="12" fill="#F4F9FC" stroke="#D5E5EE" stroke-width="1.5"/><rect x="491" y="265" width="93" height="32" rx="7" fill="#E7F6F3"/><text x="537" y="287" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#159B91">4 → 1</text><text x="597" y="288" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#159B91">ADIABATICA</text><text x="502" y="320" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#19344D">Q = 0</text><text x="502" y="347" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#56718B">Compressione • T aumenta</text></svg>