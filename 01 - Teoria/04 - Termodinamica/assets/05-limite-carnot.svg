<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Il limite reversibile di Carnot"><defs>
 <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#267CB3"/></marker>
 <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#159B91"/></marker>
 <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#D65D5F"/></marker>
 <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#DE932E"/></marker>
 </defs><rect width="900" height="420" rx="16" fill="#F8FBFF"/><rect x="18" y="18" width="864" height="384" rx="14" fill="white" stroke="#DFEAF2" stroke-width="1.5"/>
 <text x="40" y="54" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#19344D">Il limite reversibile di Carnot</text><text x="40" y="80" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#56718B">Per un motore tra due sorgenti, il rendimento massimo dipende solo da TC/TH.</text><rect x="55" y="110" width="328" height="249" rx="13" fill="#F4F9FC" stroke="#C9DDE8" stroke-width="1.8"/><text x="219" y="151" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#19344D">Rendimento massimo</text><text x="219" y="213" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#159B91">ηC = 1 − TC/TH</text><text x="219" y="263" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#D65D5F">TH = 500 K</text><text x="219" y="295" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#267CB3">TC = 300 K</text><text x="219" y="336" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#159B91">ηC = 40%</text><text x="637" y="125" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#19344D">A TH fissata</text><text x="428" y="169" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#56718B">TC/TH = 0,2</text><rect x="579" y="150" width="222" height="20" rx="5" fill="#EDF3F7" stroke="#EDF3F7" stroke-width="0"/><rect x="579" y="150" width="177" height="20" rx="5" fill="#159B91" stroke="#159B91" stroke-width="0"/><text x="812" y="168" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#159B91">80%</text><text x="428" y="224" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#56718B">TC/TH = 0,4</text><rect x="579" y="205" width="222" height="20" rx="5" fill="#EDF3F7" stroke="#EDF3F7" stroke-width="0"/><rect x="579" y="205" width="133" height="20" rx="5" fill="#159B91" stroke="#159B91" stroke-width="0"/><text x="812" y="223" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#159B91">60%</text><text x="428" y="279" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#56718B">TC/TH = 0,6</text><rect x="579" y="260" width="222" height="20" rx="5" fill="#EDF3F7" stroke="#EDF3F7" stroke-width="0"/><rect x="579" y="260" width="88" height="20" rx="5" fill="#159B91" stroke="#159B91" stroke-width="0"/><text x="812" y="278" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#159B91">40%</text><text x="428" y="334" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#56718B">TC/TH = 0,8</text><rect x="579" y="315" width="222" height="20" rx="5" fill="#EDF3F7" stroke="#EDF3F7" stroke-width="0"/><rect x="579" y="315" width="44" height="20" rx="5" fill="#159B91" stroke="#159B91" stroke-width="0"/><text x="812" y="333" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#159B91">20%</text></svg>