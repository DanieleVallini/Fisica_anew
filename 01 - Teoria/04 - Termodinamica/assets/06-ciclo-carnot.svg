 <text x="40" y="54" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#19344D">Il ciclo di Carnot nel piano p–V</text><text x="40" y="80" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#56718B">Due isoterme e due adiabatiche reversibili: il ciclo motore è percorso in senso orario.</text><line x1="143" y1="351" x2="700" y2="351" stroke="#19344D" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ab)"/><line x1="143" y1="351" x2="143" y2="118" stroke="#19344D" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ab)"/><text x="705" y="376" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#19344D">V</text><text x="119" y="121" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#19344D">p</text><path d="M220 146 C274 153 350 181 430 195" fill="none" stroke="#D65D5F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/><path d="M430 195 C486 223 563 280 631 306" fill="none" stroke="#DE932E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#aa)"/><path d="M631 306 C509 300 416 288 297 279" fill="none" stroke="#267CB3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ab)"/><path d="M297 279 C252 246 225 192 220 146" fill="none" stroke="#159B91" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#at)"/><circle cx="220" cy="146" r="6" fill="#19344D"/><text x="232" y="136" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#19344D">1</text><circle cx="430" cy="195" r="6" fill="#19344D"/><text x="442" y="185" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#19344D">2</text><circle cx="631" cy="306" r="6" fill="#19344D"/><text x="643" y="296" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#19344D">3</text><circle cx="297" cy="279" r="6" fill="#19344D"/><text x="309" y="269" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#19344D">4</text><text x="302" y="130" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#D65D5F">Isoterma TH</text><text x="513" y="347" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#267CB3">Isoterma TC</text><text x="506" y="235" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#DE932E">Adiabatica</text><text x="205" y="248" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#159B91">Adiabatica</text><rect x="711" y="144" width="143" height="190" rx="10" fill="#F5F9FC" stroke="#D2E1E9" stroke-width="1.8"/><text x="782" y="179" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#D65D5F">1 → 2</text><text x="782" y="205" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#DE932E">2 → 3</text><text x="782" y="231" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#267CB3">3 → 4</text><text x="782" y="257" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#159B91">4 → 1</text><text x="782" y="301" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#56718B">Ciclo orario</text></svg>