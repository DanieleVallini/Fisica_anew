<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
    <rect width="640" height="320" fill="white"/>
    <rect x="12" y="12" width="616" height="296" rx="18" fill="#f6f9fc" stroke="#e2eaf1"/>
    <g font-family="DejaVu Sans,Arial,sans-serif">
    <text x="34" y="46" font-size="22" text-anchor="start" font-weight="700" fill="#183955">Bilancio di calore nel calorimetro</text><text x="34" y="69" font-size="12" text-anchor="start" font-weight="400" fill="#64798a">L’energia ceduta viene assorbita dagli altri corpi</text><rect x="110" y="96" width="420" height="149" rx="12" fill="#eaf0f6" stroke="#8aa2b8" stroke-width="3"/><rect x="125" y="118" width="390" height="113" rx="8" fill="#ffffff" stroke="#b6cbd9" stroke-width="2"/><rect x="149" y="140" width="148" height="69" rx="8" fill="#fde8e6" stroke="#edc4bc" stroke-width="1"/><rect x="344" y="140" width="148" height="69" rx="8" fill="#dbeffa" stroke="#a6cfeb" stroke-width="1"/><text x="223" y="171" font-size="15" text-anchor="middle" font-weight="700" fill="#C85C5C">Corpo caldo</text><text x="223" y="193" font-size="18" text-anchor="middle" font-weight="700" fill="#C85C5C">Q₁ &lt; 0</text><text x="418" y="171" font-size="15" text-anchor="middle" font-weight="700" fill="#3178B8">Corpo freddo</text><text x="418" y="193" font-size="18" text-anchor="middle" font-weight="700" fill="#3178B8">Q₂ &gt; 0</text><line x1="301" y1="176" x2="340" y2="176" stroke="#ec9b3a" stroke-width="4" stroke-linecap="round"/><path d="M340 176 L329.52706590825096 181.8581269625949 L329.52706590825096 170.1418730374051 Z" fill="#ec9b3a"/><text x="320" y="262" font-size="15" text-anchor="middle" font-weight="400" fill="#64798a">Calorimetro isolato</text><text x="320" y="291" font-size="13" text-anchor="middle" font-weight="400" fill="#203344">Q₁ + Q₂ = 0 (se il recipiente non assorbe calore)</text></g></svg>