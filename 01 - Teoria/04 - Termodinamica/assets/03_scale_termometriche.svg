<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
    <rect width="640" height="320" fill="white"/>
    <rect x="12" y="12" width="616" height="296" rx="18" fill="#f6f9fc" stroke="#e2eaf1"/>
    <g font-family="DejaVu Sans,Arial,sans-serif">
    <text x="34" y="46" font-size="22" text-anchor="start" font-weight="700" fill="#183955">Scala Celsius e scala Kelvin</text><text x="34" y="69" font-size="12" text-anchor="start" font-weight="400" fill="#64798a">Cambia l’origine della scala, non la grandezza dell’intervallo</text><rect x="50" y="104" width="540" height="155" rx="10" fill="#ffffff" stroke="#dbe4ed" stroke-width="1"/><line x1="185" y1="115" x2="455" y2="115" stroke="#bdd4e9" stroke-width="2" stroke-linecap="round"/><circle cx="185" cy="115" r="4" fill="#3178B8" stroke="none" stroke-width="1"/><circle cx="455" cy="115" r="4" fill="#ec9b3a" stroke="none" stroke-width="1"/><text x="152" y="126" font-size="16" text-anchor="end" font-weight="700" fill="#3178B8">0 °C</text><text x="487" y="126" font-size="16" text-anchor="start" font-weight="700" fill="#ec9b3a">273,15 K</text><line x1="185" y1="167" x2="455" y2="167" stroke="#bdd4e9" stroke-width="2" stroke-linecap="round"/><circle cx="185" cy="167" r="4" fill="#3178B8" stroke="none" stroke-width="1"/><circle cx="455" cy="167" r="4" fill="#ec9b3a" stroke="none" stroke-width="1"/><text x="152" y="178" font-size="16" text-anchor="end" font-weight="700" fill="#3178B8">20 °C</text><text x="487" y="178" font-size="16" text-anchor="start" font-weight="700" fill="#ec9b3a">293,15 K</text><line x1="185" y1="218" x2="455" y2="218" stroke="#bdd4e9" stroke-width="2" stroke-linecap="round"/><circle cx="185" cy="218" r="4" fill="#3178B8" stroke="none" stroke-width="1"/><circle cx="455" cy="218" r="4" fill="#ec9b3a" stroke="none" stroke-width="1"/><text x="152" y="229" font-size="16" text-anchor="end" font-weight="700" fill="#3178B8">100 °C</text><text x="487" y="229" font-size="16" text-anchor="start" font-weight="700" fill="#ec9b3a">373,15 K</text><text x="320" y="287" font-size="13" text-anchor="middle" font-weight="400" fill="#203344">Un aumento di 1 °C equivale a un aumento di 1 K</text></g></svg>