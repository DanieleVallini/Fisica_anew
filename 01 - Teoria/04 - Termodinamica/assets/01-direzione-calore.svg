 <text x="40" y="54" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#19344D">Direzione spontanea del calore</text><text x="40" y="80" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#56718B">Per il trasferimento spontaneo, il calore passa dalla temperatura maggiore alla minore.</text><rect x="58" y="130" width="292" height="199" rx="14" fill="#FFF3E1" stroke="#EAB86E" stroke-width="1.8"/><rect x="552" y="130" width="292" height="199" rx="14" fill="#E3F3FE" stroke="#9DC7E4" stroke-width="1.8"/><text x="204" y="183" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#19344D">CORPO CALDO</text><text x="204" y="236" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#D65D5F">T = 400 K</text><text x="698" y="183" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#19344D">CORPO FREDDO</text><text x="698" y="236" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#267CB3">T = 300 K</text><line x1="359" y1="207" x2="531" y2="207" stroke="#D65D5F" stroke-width="6" stroke-linecap="round" marker-end="url(#ar)"/><text x="445" y="178" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#D65D5F">Q &gt; 0 trasferito</text><text x="450" y="364" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#159B91">Direzione spontanea: caldo → freddo</text></svg>