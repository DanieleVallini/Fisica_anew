<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Il ciclo inverso: frigorifero e pompa di calore"><defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#267CB3"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#159B91"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#D65D5F"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#DE932E"/></marker><marker id="a-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#19344D"/></marker></defs><rect x="0" y="0" width="900" height="420" rx="16" fill="#F8FBFF"/><rect x="18" y="18" width="864" height="384" rx="14" fill="#FFFFFF" stroke="#D5E5EE" stroke-width="1.5"/><text x="40" y="56" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#19344D">Il ciclo inverso: frigorifero e pompa di calore</text><text x="40" y="83" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#56718B">Stessi scambi energetici, ma cambia quale calore è considerato il risultato utile.</text><rect x="52" y="121" width="389" height="228" rx="12" fill="#F4F9FC" stroke="#D5E5EE" stroke-width="1.5"/><rect x="459" y="121" width="389" height="228" rx="12" fill="#F4F9FC" stroke="#D5E5EE" stroke-width="1.5"/><text x="245" y="156" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#267CB3">FRIGORIFERO</text><text x="653" y="156" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#159B91">POMPA DI CALORE</text><text x="245" y="203" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#19344D">COPF = QC / Lin</text><text x="653" y="203" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#19344D">COPP = QH / Lin</text><text x="245" y="244" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#56718B">TC = 270 K; TH = 300 K</text><text x="653" y="244" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#56718B">TC = 270 K; TH = 300 K</text><rect x="92" y="268" width="308" height="52" rx="8" fill="#E3F3FE" stroke="#9DC7E4" stroke-width="1.5"/><rect x="499" y="268" width="308" height="52" rx="8" fill="#E7F6F3" stroke="#A6D7CA" stroke-width="1.5"/><text x="247" y="302" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#267CB3">COPF,Carnot = 9</text><text x="653" y="302" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#159B91">COPP,Carnot = 10</text></svg>