roke-width="1.5"/><text x="588" y="165" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#159B91">2</text><text x="626" y="166" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#19344D">Espansione</text><rect x="568" y="291" width="239" height="76" rx="10" fill="#F4F9FC" stroke="#D5E5EE" stroke-width="1.5"/><text x="588" y="324" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#159B91">3</text><text x="626" y="325" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#19344D">Compressione</text><rect x="85" y="291" width="239" height="76" rx="10" fill="#F4F9FC" stroke="#D5E5EE" stroke-width="1.5"/><text x="105" y="324" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#159B91">4</text><text x="143" y="325" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#19344D">Ritorno</text><line x1="330" y1="169" x2="550" y2="169" stroke="#159B91" stroke-width="4" stroke-linecap="round" marker-end="url(#a-teal)"/><line x1="688" y1="214" x2="688" y2="280" stroke="#267CB3" stroke-width="4" stroke-linecap="round" marker-end="url(#a-blue)"/><line x1="562" y1="329" x2="333" y2="329" stroke="#159B91" stroke-width="4" stroke-linecap="round" marker-end="url(#a-teal)"/><line x1="204" y1="283" x2="204" y2="217" stroke="#267CB3" stroke-width="4" stroke-linecap="round" marker-end="url(#a-blue)"/><rect x="349" y="222" width="204" height="74" rx="10" fill="#E7F6F3" stroke="#A6D7CA" stroke-width="1.5"/><text x="451" y="255" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#159B91">ΔU ciclo = 0</text><text x="451" y="281" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#19344D">Q netto = L netto</text></svg>