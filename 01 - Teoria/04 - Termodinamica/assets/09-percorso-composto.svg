<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" role="img" aria-label="Trasformazioni consecutive"><rect x="0" y="0" width="900" height="410" rx="18" fill="#ffffff"/><rect x="16" y="15" width="868" height="378" rx="16" fill="#f2f8fb" stroke="#d8e8ed" stroke-width="2"/><text x="42" y="53" fill="#112a3d" font-family="DejaVu Sans, Arial" font-weight="700" font-size="24">Trasformazioni consecutive</text><text x="42" y="78" fill="#5a6c79" font-family="DejaVu Sans, Arial" font-size="14">Il lavoro e il calore dipendono dal percorso; ΔU solo dagli stati.</text><line x1="105" y1="320" x2="525" y2="320" stroke="#112a3d" stroke-width="2" stroke-linecap="round" /><polygon points="525,320 515.3,325.3 515.3,314.7" fill="#112a3d"/><line x1="105" y1="320" x2="105" y2="105" stroke="#112a3d" stroke-width="2" stroke-linecap="round" /><polygon points="105,105 110.3,114.7 99.7,114.7" fill="#112a3d"/><text x="86" y="100" font-family="DejaVu Sans, Arial" font-size="20" fill="#112a3d" text-anchor="start" font-weight="normal">p</text><text x="537" y="325" font-family="DejaVu Sans, Arial" font-size="20" fill="#112a3d" text-anchor="start" font-weight="normal">V</text><path d="M 205 263 V 155 H 450" stroke="#148e78" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="205" cy="263" rx="6" ry="6" fill="#1e81b0" stroke="#1e81b0" stroke-width="2"/><ellipse cx="205" cy="155" rx="6" ry="6" fill="#dd8147" stroke="#dd8147" stroke-width="2"/><ellipse cx="450" cy="155" rx="6" ry="6" fill="#7966bd" stroke="#7966bd" stroke-width="2"/><line x1="205" y1="245" x2="205" y2="185" stroke="#148e78" stroke-width="4" stroke-linecap="round" /><polygon points="205,185 210.3,194.7 199.7,194.7" fill="#148e78"/><line x1="282" y1="155" x2="375" y2="155" stroke="#dd8147" stroke-width="4" stroke-linecap="round" /><polygon points="375,155 365.3,160.3 365.3,149.7" fill="#dd8147"/><text x="181" y="275" font-family="DejaVu Sans, Arial" font-size="18" fill="#112a3d" text-anchor="start" font-weight="normal">A</text><text x="184" y="143" font-family="DejaVu Sans, Arial" font-size="18" fill="#112a3d" text-anchor="start" font-weight="normal">B</text><text x="461" y="159" font-family="DejaVu Sans, Arial" font-size="18" fill="#112a3d" text-anchor="start" font-weight="normal">C</text><text x="160" y="340" font-family="DejaVu Sans, Arial" font-size="15" fill="#112a3d" text-anchor="start" font-weight="normal">V₁</text><text x="436" y="340" font-family="DejaVu Sans, Arial" font-size="15" fill="#112a3d" text-anchor="start" font-weight="normal">V₂</text><text x="69" y="160" font-family="DejaVu Sans, Arial" font-size="15" fill="#112a3d" text-anchor="start" font-weight="normal">p₂</text><text x="69" y="268" font-family="DejaVu Sans, Arial" font-size="15" fill="#112a3d" text-anchor="start" font-weight="normal">p₁</text><rect x="565" y="128" width="263" height="218" rx="10" fill="#ffffff" stroke="#d3e2e6" stroke-width="2"/><text x="590" y="163" font-family="DejaVu Sans, Arial" font-size="18" fill="#148e78" text-anchor="start" font-weight="bold">A → B: isocora</text><text x="590" y="202" font-family="DejaVu Sans, Arial" font-size="18" fill="#112a3d" text-anchor="start" font-weight="normal">L₁ = 0</text><text x="590" y="241" font-family="DejaVu Sans, Arial" font-size="18" fill="#dd8147" text-anchor="start" font-weight="bold">B → C: isobara</text><text x="590" y="279" font-family="DejaVu Sans, Arial" font-size="16" fill="#112a3d" text-anchor="start" font-weight="normal">L₂ = p₂(V₂ − V₁)</text><text x="590" y="320" font-family="DejaVu Sans, Arial" font-size="18" fill="#112a3d" text-anchor="start" font-weight="normal">Ltot = L₁ + L₂</text></svg>