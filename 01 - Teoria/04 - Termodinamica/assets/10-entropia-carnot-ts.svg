 <text x="40" y="54" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#19344D">Carnot nel piano temperatura–entropia</text><text x="40" y="80" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#56718B">Nel ciclo reversibile: due isoterme orizzontali e due adiabatiche verticali.</text><line x1="156" y1="343" x2="693" y2="343" stroke="#19344D" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ab)"/><line x1="156" y1="343" x2="156" y2="120" stroke="#19344D" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ab)"/><text x="702" y="371" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#19344D">S</text><text x="131" y="123" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#19344D">T</text><rect x="290" y="151" width="283" height="157" rx="1" fill="#DDF0E8" stroke="#C9E7DD" stroke-width="1.8"/><line x1="290" y1="151" x2="567" y2="151" stroke="#D65D5F" stroke-width="5" stroke-linecap="round" marker-end="url(#ar)"/><line x1="573" y1="156" x2="573" y2="302" stroke="#159B91" stroke-width="5" stroke-linecap="round" marker-end="url(#at)"/><line x1="567" y1="309" x2="296" y2="309" stroke="#267CB3" stroke-width="5" stroke-linecap="round" marker-end="url(#ab)"/><line x1="290" y1="303" x2="290" y2="155" stroke="#159B91" stroke-width="5" stroke-linecap="round" marker-end="url(#at)"/><text x="259" y="158" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="end" fill="#D65D5F">TH</text><text x="259" y="314" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="end" fill="#267CB3">TC</text><text x="290" y="369" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#56718B">S1</text><text x="573" y="369" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#56718B">S2</text><text x="433" y="142" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#D65D5F">QH = TH·ΔS</text><text x="434" y="331" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#267CB3">QC = TC·ΔS</text><rect x="640" y="168" width="211" height="113" rx="10" fill="#F2F8FB" stroke="#C8DEE9" stroke-width="1.8"/><text x="746" y="197" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#159B91">ADIABATICHE</text><text x="746" y="227" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#19344D">S costante</text><text x="746" y="256" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#56718B">Area = L netto</text></svg>