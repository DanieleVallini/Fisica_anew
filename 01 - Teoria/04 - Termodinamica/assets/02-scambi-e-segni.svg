<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" role="img" aria-label="Convenzione dei segni"><rect x="0" y="0" width="900" height="410" rx="18" fill="#ffffff"/><rect x="16" y="15" width="868" height="378" rx="16" fill="#f2f8fb" stroke="#d8e8ed" stroke-width="2"/><text x="42" y="53" fill="#112a3d" font-family="DejaVu Sans, Arial" font-weight="700" font-size="24">Convenzione dei segni</text><text x="42" y="78" fill="#5a6c79" font-family="DejaVu Sans, Arial" font-size="14">L è positivo se il gas compie lavoro; Q è positivo se il gas assorbe calore.</text><rect x="310" y="155" width="280" height="150" rx="15" fill="#ffffff" stroke="#bccfd8" stroke-width="2"/><text x="450" y="211" font-family="DejaVu Sans, Arial" font-size="36" fill="#112a3d" text-anchor="middle" font-weight="bold">GAS</text><text x="450" y="246" font-family="DejaVu Sans, Arial" font-size="22" fill="#112a3d" text-anchor="middle" font-weight="bold">ΔU = Q − L</text><line x1="95" y1="235" x2="305" y2="235" stroke="#dd8147" stroke-width="7" stroke-linecap="round" /><polygon points="305,235 295.3,240.3 295.3,229.7" fill="#dd8147"/><text x="96" y="195" font-family="DejaVu Sans, Arial" font-size="22" fill="#dd8147" text-anchor="start" font-weight="normal">Q &gt; 0</text><text x="98" y="221" font-family="DejaVu Sans, Arial" font-size="15" fill="#5a6c79" text-anchor="start" font-weight="normal">calore entrante</text><line x1="590" y1="235" x2="805" y2="235" stroke="#1e81b0" stroke-width="7" stroke-linecap="round" /><polygon points="805,235 795.3,240.3 795.3,229.7" fill="#1e81b0"/><text x="713" y="195" font-family="DejaVu Sans, Arial" font-size="22" fill="#1e81b0" text-anchor="start" font-weight="normal">L &gt; 0</text><text x="665" y="221" font-family="DejaVu Sans, Arial" font-size="15" fill="#5a6c79" text-anchor="start" font-weight="normal">lavoro uscente</text><text x="450" y="355" font-family="DejaVu Sans, Arial" font-size="17" fill="#112a3d" text-anchor="middle" font-weight="normal">Q &lt; 0: calore ceduto        L &lt; 0: compressione</text></svg>