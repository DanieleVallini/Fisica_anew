 <text x="40" y="54" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#19344D">Calore assorbito: parte utile e parte ceduta</text><text x="40" y="80" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#56718B">Esempio: una macchina con rendimento 37,5% non trasforma tutto il calore in lavoro.</text><rect x="57" y="123" width="793" height="78" rx="12" fill="#F0F8FB" stroke="#D7E7ED" stroke-width="1.8"/><text x="87" y="151" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#19344D">Calore assorbito QH = 1200 J</text><rect x="86" y="169" width="725" height="17" rx="2" fill="#D7EAF7" stroke="#D7EAF7" stroke-width="0"/><rect x="58" y="248" width="297" height="88" rx="12" fill="#E6F6F0" stroke="#9ECDBE" stroke-width="1.8"/><rect x="370" y="248" width="480" height="88" rx="12" fill="#EEF3FA" stroke="#C7D9E7" stroke-width="1.8"/><text x="207" y="284" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#159B91">L = 450 J</text><text x="207" y="313" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#159B91">37,5% utile</text><text x="610" y="284" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#267CB3">QC = 750 J</text><text x="610" y="313" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#267CB3">62,5% ceduto</text><text x="450" y="379" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#56718B">1200 J = 450 J + 750 J</text></svg>