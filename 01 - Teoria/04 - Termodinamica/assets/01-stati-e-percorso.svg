<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" role="img" aria-label="Stati e trasformazioni"><rect x="0" y="0" width="900" height="410" rx="18" fill="#ffffff"/><rect x="16" y="15" width="868" height="378" rx="16" fill="#f2f8fb" stroke="#d8e8ed" stroke-width="2"/><text x="42" y="53" fill="#112a3d" font-family="DejaVu Sans, Arial" font-weight="700" font-size="24">Stati e trasformazioni</text><text x="42" y="78" fill="#5a6c79" font-family="DejaVu Sans, Arial" font-size="14">Ogni stato ha coordinate p, V, T; il percorso determina lavoro e calore.</text><line x1="84" y1="319" x2="444" y2="319" stroke="#112a3d" stroke-width="2" stroke-linecap="round" /><polygon points="444,319 434.3,324.3 434.3,313.7" fill="#112a3d"/><line x1="84" y1="319" x2="84" y2="114" stroke="#112a3d" stroke-width="2" stroke-linecap="round" /><polygon points="84,114 89.3,123.7 78.7,123.7" fill="#112a3d"/><text x="65" y="109" font-family="DejaVu Sans, Arial" font-size="20" fill="#112a3d" text-anchor="start" font-weight="normal">p</text><text x="456" y="324" font-family="DejaVu Sans, Arial" font-size="20" fill="#112a3d" text-anchor="start" font-weight="normal">V</text><path d="M 153 255 Q 241 228 375 166" stroke="#1e81b0" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="153" cy="255" rx="7" ry="7" fill="#1e81b0" stroke="#1e81b0" stroke-width="2"/><ellipse cx="375" cy="166" rx="7" ry="7" fill="#dd8147" stroke="#dd8147" stroke-width="2"/><text x="134" y="243" font-family="DejaVu Sans, Arial" font-size="18" fill="#112a3d" text-anchor="start" font-weight="normal">A</text><text x="388" y="169" font-family="DejaVu Sans, Arial" font-size="18" fill="#112a3d" text-anchor="start" font-weight="normal">B</text><line x1="226" y1="229" x2="288" y2="202" stroke="#1e81b0" stroke-width="4" stroke-linecap="round" /><polygon points="288,202 281.3,210.7 277.0,201.0" fill="#1e81b0"/><rect x="515" y="128" width="304" height="173" rx="14" fill="#ffffff" stroke="#cee2e9" stroke-width="2"/><text x="543" y="170" font-family="DejaVu Sans, Arial" font-size="19" fill="#1e81b0" text-anchor="start" font-weight="normal">Stato A: (p₁, V₁, T₁)</text><text x="543" y="211" font-family="DejaVu Sans, Arial" font-size="22" fill="#112a3d" text-anchor="start" font-weight="bold">Trasformazione</text><text x="543" y="245" font-family="DejaVu Sans, Arial" font-size="19" fill="#dd8147" text-anchor="start" font-weight="normal">Stato B: (p₂, V₂, T₂)</text><text x="543" y="287" font-family="DejaVu Sans, Arial" font-size="16" fill="#5a6c79" text-anchor="start" font-weight="normal">n = costante (sistema chiuso)</text></svg>