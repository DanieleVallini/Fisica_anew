<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
    <rect width="640" height="320" fill="white"/>
    <rect x="12" y="12" width="616" height="296" rx="18" fill="#f6f9fc" stroke="#e2eaf1"/>
    <g font-family="DejaVu Sans,Arial,sans-serif">
    <text x="34" y="46" font-size="22" text-anchor="start" font-weight="700" fill="#183955">Temperatura e calore</text><text x="34" y="69" font-size="12" text-anchor="start" font-weight="400" fill="#64798a">Il calore si trasferisce quando esiste una differenza di temperatura</text><rect x="50" y="105" width="190" height="143" rx="16" fill="#fde8e6" stroke="#efc0bb" stroke-width="2"/><rect x="400" y="105" width="190" height="143" rx="16" fill="#dbeffa" stroke="#b8d8ef" stroke-width="2"/><text x="145" y="137" font-size="18" text-anchor="middle" font-weight="700" fill="#C85C5C">Corpo caldo</text><text x="495" y="137" font-size="18" text-anchor="middle" font-weight="700" fill="#3178B8">Corpo freddo</text><text x="145" y="177" font-size="22" text-anchor="middle" font-weight="700" fill="#C85C5C">T = 80 °C</text><text x="495" y="177" font-size="22" text-anchor="middle" font-weight="700" fill="#3178B8">T = 20 °C</text><line x1="257" y1="174" x2="383" y2="174" stroke="#ec9b3a" stroke-width="5" stroke-linecap="round"/><path d="M383 174 L372.52706590825096 179.8581269625949 L372.52706590825096 168.1418730374051 Z" fill="#ec9b3a"/><text x="320" y="154" font-size="18" text-anchor="middle" font-weight="700" fill="#ec9b3a">Q (calore)</text><text x="320" y="280" font-size="13" text-anchor="middle" font-weight="400" fill="#203344">Temperatura = stato; calore = energia trasferita</text></g></svg>