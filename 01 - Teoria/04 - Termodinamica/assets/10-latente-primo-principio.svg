<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Calore latente e primo principio"><defs><marker id="a19344D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#19344D"/></marker><marker id="a267CB3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#267CB3"/></marker><marker id="a159B91" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#159B91"/></marker><marker id="aD65D5F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#D65D5F"/></marker><marker id="aDE932E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#DE932E"/></marker><marker id="a56718B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#56718B"/></marker></defs><rect x="0" y="0" width="900" height="420" rx="16" fill="#F8FBFF" stroke="none" stroke-width="1.5"/><rect x="18" y="18" width="864" height="384" rx="14" fill="#FFFFFF" stroke="#DFEAF2" stroke-width="1.5"/><text x="42" y="55" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#19344D" text-anchor="start">Calore latente e primo principio</text><text x="42" y="81" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#56718B" text-anchor="start">Durante un cambiamento di fase il calore scambiato non coincide sempre con ΔU.</text><rect x="49" y="123" width="387" height="239" rx="12" fill="#EDF7FE" stroke="#DFEAF2" stroke-width="1.5"/><rect x="464" y="123" width="387" height="239" rx="12" fill="#FFF5EB" stroke="#DFEAF2" stroke-width="1.5"/><text x="242" y="163" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#267CB3" text-anchor="middle">CALORIMETRIA</text><text x="655" y="163" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#DE932E" text-anchor="middle">PRIMO PRINCIPIO</text><text x="242" y="207" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#267CB3" text-anchor="middle">Q = m · L</text><text x="655" y="207" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#DE932E" text-anchor="middle">ΔU = Q − Lavoro</text><text x="242" y="253" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#56718B" text-anchor="middle">Scambio termico nel</text><text x="242" y="277" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#56718B" text-anchor="middle">cambiamento di fase</text><text x="655" y="252" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#56718B" text-anchor="middle">In espansione può</text><text x="655" y="275" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#56718B" text-anchor="middle">esserci lavoro p · ΔV</text><text x="452" y="391" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#19344D" text-anchor="middle">Non confondere il calore latente con la variazione di energia interna.</text></svg>