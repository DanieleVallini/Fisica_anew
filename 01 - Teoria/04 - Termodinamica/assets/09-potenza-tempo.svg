<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Potenza termica e tempo di fusione"><defs><marker id="a19344D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#19344D"/></marker><marker id="a267CB3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#267CB3"/></marker><marker id="a159B91" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#159B91"/></marker><marker id="aD65D5F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#D65D5F"/></marker><marker id="aDE932E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#DE932E"/></marker><marker id="a56718B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#56718B"/></marker></defs><rect x="0" y="0" width="900" height="420" rx="16" fill="#F8FBFF" stroke="none" stroke-width="1.5"/><rect x="18" y="18" width="864" height="384" rx="14" fill="#FFFFFF" stroke="#DFEAF2" stroke-width="1.5"/><text x="42" y="55" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#19344D" text-anchor="start">Potenza termica e tempo di fusione</text><text x="42" y="81" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#56718B" text-anchor="start">Un riscaldatore fornisce energia a un certo ritmo (watt = joule/secondo).</text><rect x="66" y="134" width="239" height="215" rx="12" fill="#F5F9FC" stroke="#DFEAF2" stroke-width="1.5"/><rect x="380" y="134" width="444" height="215" rx="12" fill="#F5F9FC" stroke="#DFEAF2" stroke-width="1.5"/><rect x="128" y="206" width="112" height="98" rx="9" fill="#C8E6F7" stroke="#7DB9DA" stroke-width="1.5"/><line x1="154" y1="284" x2="213" y2="284" stroke="#DE932E" stroke-width="4" stroke-linecap="round"/><rect x="147" y="225" width="20" height="18" rx="3" fill="#F9FCFF" stroke="#8DBFD9" stroke-width="1.5"/><rect x="188" y="239" width="20" height="18" rx="3" fill="#F9FCFF" stroke="#8DBFD9" stroke-width="1.5"/><rect x="215" y="215" width="20" height="18" rx="3" fill="#F9FCFF" stroke="#8DBFD9" stroke-width="1.5"/><rect x="172" y="272" width="20" height="18" rx="3" fill="#F9FCFF" stroke="#8DBFD9" stroke-width="1.5"/><line x1="247" y1="247" x2="353" y2="247" stroke="#D65D5F" stroke-width="5" stroke-linecap="round" marker-end="url(#aD65D5F)"/><text x="300" y="217" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#D65D5F" text-anchor="middle">P</text><text x="602" y="182" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#19344D" text-anchor="middle">Q = P · t</text><text x="602" y="228" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#159B91" text-anchor="middle">t = Q / P</text><text x="602" y="275" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#56718B" text-anchor="middle">Esempio: 167 kJ / 500 W = 334 s</text><text x="602" y="312" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#56718B" text-anchor="middle">Assumiamo assenza di perdite termiche.</text></svg>