<rect x="18" y="18" width="864" height="384" rx="14" fill="#FFFFFF" stroke="#DFEAF2" stroke-width="1.5"/>
<text x="42" y="52" fill="#19344D" font-family="DejaVu Sans,sans-serif" font-size="24" font-weight="bold">Legge di Dalton: pressioni parziali</text>
<text x="42" y="80" fill="#56718B" font-family="DejaVu Sans,sans-serif" font-size="15">La pressione totale è la somma dei contributi dei singoli gas ideali.</text>
<rect x="112" y="143" width="670" height="92" rx="9" fill="#E9F4FA" stroke="#BCD7E6" stroke-width="2" opacity="1"/><rect x="114" y="145" width="134" height="88" rx="5" fill="#E7A34F" stroke="#E7A34F" stroke-width="2" opacity="1"/><rect x="248" y="145" width="532" height="88" rx="5" fill="#348CC0" stroke="#348CC0" stroke-width="2" opacity="1"/><text x="181" y="198" fill="#FFFFFF" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="bold" text-anchor="middle">20% O₂</text><text x="513" y="198" fill="#FFFFFF" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="bold" text-anchor="middle">80% N₂</text><text x="450" y="292" fill="#19344D" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="bold" text-anchor="middle">Pressione totale = 2,0 bar</text><text x="450" y="340" fill="#159B91" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="bold" text-anchor="middle">0,40 bar  +  1,60 bar  =  2,0 bar</text></svg>