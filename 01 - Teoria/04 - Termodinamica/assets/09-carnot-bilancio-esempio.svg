<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Esempio completo: motore reversibile di Carnot"><defs><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#267CB3"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#159B91"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#D65D5F"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#DE932E"/></marker><marker id="a-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#19344D"/></marker></defs><rect x="0" y="0" width="900" height="420" rx="16" fill="#F8FBFF"/><rect x="18" y="18" width="864" height="384" rx="14" fill="#FFFFFF" stroke="#D5E5EE" stroke-width="1.5"/><text x="40" y="56" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#19344D">Esempio completo: motore reversibile di Carnot</text><text x="40" y="83" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#56718B">TH = 500 K, TC = 300 K e QH = 1200 J: il rendimento massimo è il 40%.</text><rect x="80" y="121" width="721" height="75" rx="10" fill="#FFF3E1" stroke="#E9C592" stroke-width="1.5"/><text x="115" y="153" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#19344D">Calore assorbito QH = 1200 J</text><rect x="120" y="172" width="611" height="10" rx="4" fill="#D6E6F3"/><rect x="80" y="220" width="286" height="118" rx="11" fill="#E7F6F3" stroke="#A7D9CE" stroke-width="1.5"/><rect x="386" y="220" width="415" height="118" rx="11" fill="#E3F3FE" stroke="#9FC8E1" stroke-width="1.5"/><text x="223" y="258" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#159B91">Lavoro utile</text><text x="223" y="300" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#159B91">L = 480 J</text><text x="592" y="258" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#267CB3">Calore ceduto</text><text x="592" y="300" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#267CB3">QC = 720 J</text><text x="442" y="376" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#19344D">1200 J = 480 J + 720 J</text></svg>