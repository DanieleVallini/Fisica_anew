<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
    <rect width="640" height="320" fill="white"/>
    <rect x="12" y="12" width="616" height="296" rx="18" fill="#f6f9fc" stroke="#e2eaf1"/>
    <g font-family="DejaVu Sans,Arial,sans-serif">
    <text x="34" y="46" font-size="22" text-anchor="start" font-weight="700" fill="#183955">Calore specifico: Q = m c ΔT</text><text x="34" y="69" font-size="12" text-anchor="start" font-weight="400" fill="#64798a">Massa e calore specifico determinano l’energia necessaria</text><rect x="62" y="110" width="217" height="140" rx="12" fill="#dbeffa" stroke="#9ec8e7" stroke-width="2"/><rect x="361" y="110" width="217" height="140" rx="12" fill="#def2e8" stroke="#abdfc6" stroke-width="2"/><text x="170" y="145" font-size="16" text-anchor="middle" font-weight="700" fill="#183955">0,5 kg di acqua</text><text x="469" y="145" font-size="16" text-anchor="middle" font-weight="700" fill="#2f8d66">1,0 kg di acqua</text><text x="170" y="190" font-size="20" text-anchor="middle" font-weight="700" fill="#3178B8">ΔT = 20 K</text><text x="469" y="190" font-size="20" text-anchor="middle" font-weight="700" fill="#2f8d66">ΔT = 20 K</text><text x="170" y="223" font-size="17" text-anchor="middle" font-weight="700" fill="#3178B8">Q = 41,9 kJ</text><text x="469" y="223" font-size="17" text-anchor="middle" font-weight="700" fill="#2f8d66">Q = 83,7 kJ</text><text x="320" y="285" font-size="13" text-anchor="middle" font-weight="400" fill="#203344">Stessa sostanza e stesso ΔT: massa doppia → calore doppio</text></g></svg>